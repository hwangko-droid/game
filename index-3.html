    { t:"소리로 위치를 확인하며 각자 다른 방향을 살핀다", ok:false, d:{energy:-1}, note:"안개는 소리의 방향을 흐트러뜨린다. 몇 걸음 만에 서로를 잃었다." },
    { t:"내려가면 걷히니 아래로 내려간다", ok:false, d:{energy:-1}, note:"안개 속 내리막은 어느 쪽이 골짜기이고 어느 쪽이 낭떠러지인지 알려주지 않는다." }]},

{ id:"C04", kind:"자원", title:"눈에서 물 만들기",
  body:"물은 없고 눈은 얼마든지 있다.",
  choices:[
    { t:"그릇에 물을 조금 먼저 붓고 눈을 조금씩 더해 녹인다", ok:true, d:{water:1}, note:"바닥이 타지 않고 빠르게 녹았다." },
    { t:"눈보다 얼음을 골라 녹인다", ok:true, d:{water:1}, note:"같은 부피에서 얼음이 물을 훨씬 많이 낸다." },
    { t:"빈 그릇에 눈을 가득 담고 불에 올린다", ok:false, d:{energy:-1}, note:"마른 눈은 열을 위로 전하지 못해 바닥부터 탄다. 그릇 하나를 태워 먹었다." },
    { t:"눈을 입에 넣어 녹여 마신다", ok:false, d:{energy:-1}, note:"눈을 녹이는 데 드는 열은 전부 몸에서 나온다. 물 몇 모금과 체온을 바꿨다." },
    { t:"불 옆에 눈을 쌓아두고 저절로 녹기를 기다린다", ok:false, d:{water:-1}, note:"녹은 물이 땅으로 스몄다. 그릇 없이는 아무것도 남지 않는다." }]},

{ id:"C05", kind:"함정", hard:true, title:"목이 마르다",
  body:"물통이 얼어붙었다. 발밑에는 깨끗해 보이는 눈이 가득하다.",
  choices:[
    { t:"불로 눈을 녹여 미지근하게 만든 뒤 마신다", ok:true, d:{water:1}, note:"녹이는 수고가 체온을 지켰다." },
    { t:"깨끗한 눈이니 그냥 한 움큼씩 먹는다", ok:false, d:{energy:-1}, note:"눈 1리터를 몸 안에서 녹이는 데 드는 열은 상당하다. 추운 곳에서 눈을 먹는 건 체온을 물과 바꾸는 거래다." },
    { t:"눈을 입에 물고 천천히 녹여 마신다", ok:false, d:{energy:-1}, note:"천천히 해도 열은 똑같이 몸에서 나간다. 게다가 입안이 얼어붙듯 아팠다." },
    { t:"눈을 옷 안쪽에 넣어 체온으로 녹인다", ok:false, d:{energy:-1}, note:"몸에 직접 붙인 얼음이었다. 녹은 물이 옷을 적셔 상황이 두 배로 나빠졌다." },
    { t:"물통을 몸에 품어 녹인 뒤 마신다", ok:false, d:{energy:-1}, note:"통째로 언 물은 체온으로 녹지 않는다. 밤새 가슴만 차가웠다." }]},

{ id:"C06", kind:"자원", hard:true, title:"바위의 이끼",
  body:"먹을 것이 보이지 않는다. 바위에 회색 이끼 같은 것이 잔뜩 붙어 있다.",
  choices:[
    { t:"물에 여러 번 담가 우려내고 물을 버린 뒤 오래 끓여 먹는다", ok:true, d:{food:1}, note:"우려내는 과정이 전부였다." },
    { t:"그냥 뜯어 씹어 먹는다", ok:false, d:{food:-1}, note:"지의류에는 강한 산이 들어 있다. 처리 없이 먹으면 위와 장을 상하게 하고 심한 복통을 부른다." },
    { t:"한 번 끓여서 국물까지 마신다", ok:false, d:{food:-1}, note:"우려낸 물에 그 산이 다 녹아 있다. 국물이 가장 위험한 부분이었다." },
    { t:"말려서 가루로 만들어 먹는다", ok:false, d:{food:-1}, note:"말린다고 성분이 없어지지 않는다." },
    { t:"먹을 수 없는 것이라 판단하고 지나친다", ok:false, d:{food:-1}, note:"제대로 처리하면 이 지역에서 몇 안 되는 식량이었다. 굶은 채 지나쳤다." }]},

{ id:"C07", kind:"자원", title:"나무껍질",
  body:"눈밭에 먹을 것이 없다. 침엽수가 늘어서 있다.",
  choices:[
    { t:"바깥 껍질을 벗기고 안쪽의 연한 층만 벗겨 삶아 먹는다", ok:true, d:{food:1}, note:"안쪽 얇은 층이 유일하게 먹을 수 있는 부분이었다." },
    { t:"솔잎을 끓여 차처럼 마신다", ok:true, d:{water:1}, note:"따뜻한 물과 함께 비타민을 얻었다." },
    { t:"바깥 껍질째 잘라 오래 끓여 먹는다", ok:false, d:{food:-1}, note:"바깥 껍질은 나무 그 자체다. 씹는 데 쓴 힘이 얻은 것보다 컸다." },
    { t:"한 나무에서 껍질을 빙 둘러 벗겨 많이 얻는다", ok:false, d:{food:-1}, note:"빙 두르면 나무가 죽는다. 며칠 뒤 다시 갔을 때 아무것도 없었다." },
    { t:"주목처럼 붉은 열매가 달린 나무를 고른다", ok:false, d:{energy:-1}, note:"주목은 잎도 씨도 강한 독을 품는다. 침엽수라고 다 같지 않다." }]},

{ id:"C08", kind:"몸", hard:true, title:"하얘진 손끝",
  body:"딸의 손가락 끝이 하얗게 굳고 감각이 없다.",
  choices:[
    { t:"아빠의 겨드랑이나 배에 손을 넣어 체온으로 천천히 녹인다", ok:true, d:{energy:1}, note:"사람 체온이 가장 안전한 온도였다." },
    { t:"불에 가까이 대어 빠르게 녹인다", ok:false, d:{energy:-1}, note:"감각이 없는 손은 뜨거움을 느끼지 못한다. 동상 위에 화상이 겹쳤다." },
    { t:"눈으로 문질러 감각을 되살린다", ok:false, d:{energy:-1}, note:"얼어붙은 조직을 문지르면 얼음 결정이 세포를 찢는다. 오래된 민간요법 중 가장 해로운 것이다." },
    { t:"세게 주물러 피가 돌게 한다", ok:false, d:{energy:-1}, note:"마찰이 조직을 망가뜨렸다." },
    { t:"녹였다가 다시 얼 수 있으니 그대로 두고 이동한다", ok:false, d:{energy:-1}, note:"판단 자체는 일리가 있지만, 여기는 오늘 밤 안에 거처로 돌아갈 수 있는 거리였다. 방치할 이유가 없었다." }]},

{ id:"C09", kind:"자원", title:"발자국",
  body:"눈 위에 짐승 발자국이 선명하게 나 있다.",
  choices:[
    { t:"발자국이 여러 번 겹친 길목을 찾아 덫을 놓는다", ok:true, d:{food:1}, note:"짐승은 같은 길로 다닌다." },
    { t:"발자국의 가장자리가 무너진 정도로 얼마나 오래됐는지 판단한다", ok:true, d:{food:1}, note:"신선한 자국만 따라갔다." },
    { t:"가장 큰 발자국을 따라간다", ok:false, d:{energy:-1}, note:"큰 발자국의 주인은 사냥감이 아니라 사냥꾼이었다." },
    { t:"발자국을 곧장 따라가 짐승을 쫓는다", ok:false, d:{energy:-1}, note:"눈밭에서 쫓는 사냥은 체력을 가장 빠르게 태운다. 기다리는 쪽이 이긴다." },
    { t:"발자국이 많은 곳에 자리를 잡고 야영한다", ok:false, d:{energy:-1}, note:"짐승이 다니는 길 한복판에 누웠다." }]},

{ id:"C10", kind:"자원", title:"식량 저장",
  body:"큰 짐승을 잡았다. 다 먹을 수 없는 양이다.",
  choices:[
    { t:"얼려서 짐승이 못 닿는 높은 가지에 매달아 둔다", ok:true, d:{food:1}, note:"추위가 냉장고였다." },
    { t:"얇게 저며 얼려 말린 뒤 보관한다", ok:true, d:{food:1}, note:"얼면서 마르자 몇 배로 오래 갔다." },
    { t:"눈 속에 묻어 두고 표시해 둔다", ok:false, d:{food:-1}, note:"냄새는 눈을 통과한다. 다음 날 파헤쳐져 있었다." },
    { t:"거처 안에 두어야 안전하니 옆에 쌓아둔다", ok:false, d:{food:-1}, note:"짐승을 잠자리로 불러들였다." },
    { t:"어차피 오래 가니 손질하지 않고 통째로 둔다", ok:false, d:{food:-1}, note:"내장부터 상한다. 얼기 전에 꺼냈어야 했다." }]},

{ id:"C11", kind:"위기", hard:true, title:"얼음 위",
  body:"얼어붙은 호수를 건너면 반나절을 아낀다. 얼음이 두꺼워 보인다.",
  choices:[
    { t:"건너지 않고 물가를 따라 돌아간다", ok:true, d:{energy:1}, note:"반나절과 목숨을 바꿀 이유가 없었다." },
    { t:"얼음이 하얗고 불투명한 곳을 골라 건넌다", ok:false, d:{energy:-1}, note:"하얗고 불투명한 얼음은 공기가 섞여 약하다. 투명하고 검푸른 얼음이 단단하다. 색으로 판단한 방향이 반대였다." },
    { t:"둘이 손을 잡고 붙어서 빠르게 건넌다", ok:false, d:{energy:-1}, note:"한곳에 무게를 모았다. 둘 다 빠졌다." },
    { t:"눈이 덮여 평평한 곳으로 건넌다", ok:false, d:{energy:-1}, note:"눈은 얼음을 이불처럼 덮어 얼지 못하게 한다. 눈 덮인 얼음이 가장 얇다." },
    { t:"막대로 두드려 소리를 확인하며 건넌다", ok:false, d:{energy:-1}, note:"두드려서 알 수 있었다면 얼음 사고는 없었을 것이다. 소리가 바뀌었을 때는 이미 그 위였다." }]},

{ id:"C12", kind:"위기", hard:true, title:"물에 빠졌다",
  body:"얼음이 깨져 아빠가 허리까지 물에 빠졌다. 겨우 기어 나왔다.",
  choices:[
    { t:"즉시 젖은 옷을 벗고 눈으로 몸의 물기를 훔친 뒤 마른 것을 입는다", ok:true, d:{energy:1}, note:"마른 눈이 수건 노릇을 했다. 물기를 남기지 않은 게 살렸다." },
    { t:"움직이면 몸이 데워지니 그대로 빠르게 걸어 거처로 돌아간다", ok:false, d:{energy:-1}, note:"젖은 옷을 입은 채 바람을 맞으며 걸었다. 걷는 동안 체온이 계속 떨어졌다." },
    { t:"불을 피울 때까지 참고 젖은 채로 기다린다", ok:false, d:{energy:-1}, note:"불을 피우는 몇 분이 가장 위험한 몇 분이었다." },
    { t:"옷을 벗으면 더 추우니 그대로 두고 위에 덮는다", ok:false, d:{energy:-1}, note:"젖은 층이 몸에 붙어 있는 한 무엇을 덮어도 소용없다." },
    { t:"뜨거운 것을 마셔 안에서부터 데운다", ok:false, d:{energy:-1}, note:"안을 데우는 것보다 젖은 것을 벗는 게 먼저였다. 순서가 틀렸다." }]},

{ id:"C13", kind:"준비", title:"눈으로 만든 집",
  body:"바람이 거세다. 눈은 충분히 쌓여 있다.",
  choices:[
    { t:"눈더미에 옆으로 구멍을 파고, 잠자리를 입구보다 높게 만든다", ok:true, d:{energy:1}, note:"찬 공기는 아래로 흐른다. 높은 잠자리가 따뜻했다." },
    { t:"천장에 작은 구멍을 뚫어 공기가 통하게 한다", ok:true, d:{energy:1}, note:"막힌 눈집에서는 숨이 문제가 된다." },
    { t:"입구를 크게 내어 드나들기 편하게 한다", ok:false, d:{energy:-1}, note:"큰 입구로 찬 바람이 그대로 들어왔다. 좁을수록 따뜻하다." },
    { t:"완전히 밀폐해 열이 새지 않게 한다", ok:false, d:{energy:-1}, note:"불을 피운 밀폐 공간에서 둘 다 머리가 아파 깼다. 조금 더 잤으면 못 깼다." },
    { t:"바닥에 바로 누워 눈의 냉기를 견딘다", ok:false, d:{energy:-1}, note:"땅으로 빠지는 열이 가장 크다. 나뭇가지든 뭐든 깔았어야 했다." }]},

{ id:"C14", kind:"위기", hard:true, title:"하얀 벽",
  body:"눈보라가 몰아치며 하늘과 땅의 경계가 사라졌다. 어디가 위인지도 모르겠다.",
  choices:[
    { t:"그 자리에 눈을 파고 들어가 바람을 피하며 지나가기를 기다린다", ok:true, d:{energy:1}, note:"움직이지 않은 것이 유일한 정답이었다." },
    { t:"방향을 잃지 않게 서로 묶고 천천히 이동한다", ok:false, d:{energy:-1}, note:"묶는 건 옳았지만 이동한 게 틀렸다. 화이트아웃에서는 원을 그리며 같은 자리를 맴돌게 된다." },
    { t:"바람이 부는 방향을 기준 삼아 직진한다", ok:false, d:{energy:-1}, note:"눈보라의 바람은 방향을 계속 바꾼다. 기준이 아니었다." },
    { t:"낮은 쪽으로 계속 내려가면 벗어난다", ok:false, d:{energy:-1}, note:"어디가 아래인지 알 수 없는 상태였다. 그게 화이트아웃이다." },
    { t:"소리를 지르며 서로 위치를 확인하면서 나아간다", ok:false, d:{energy:-1}, note:"눈보라 속에서 목소리는 몇 미터도 가지 않는다." }]},

{ id:"C15", kind:"준비", title:"불",
  body:"모든 것이 젖었거나 얼어 있다. 불이 필요하다.",
  choices:[
    { t:"침엽수의 굳은 송진 덩어리를 모아 불쏘시개로 쓴다", ok:true, d:{energy:1}, note:"송진은 젖어도 탄다." },
    { t:"죽은 나무의 속을 쪼개 마른 심재를 꺼내 쓴다", ok:true, d:{energy:1}, note:"겉이 얼어도 속은 말라 있었다." },
    { t:"눈 위에 바로 불을 피운다", ok:false, d:{energy:-1}, note:"녹은 물이 불을 껐고, 불은 스스로 판 구덩이 속으로 가라앉았다. 바닥에 나무를 깔았어야 했다." },
    { t:"불을 크게 피워 주변 눈까지 녹인다", ok:false, d:{energy:-1}, note:"녹은 눈이 다시 얼어 자리 전체가 빙판이 됐다." },
    { t:"거처 안 깊숙이 불을 피워 열을 가둔다", ok:false, d:{energy:-1}, note:"환기 없는 실내의 불은 소리 없이 사람을 재운다." }]},

{ id:"C16", kind:"준비", hard:true, title:"잠자리",
  body:"땅바닥에 그대로 누우면 밤을 못 넘길 것 같다.",
  choices:[
    { t:"침엽수 가지와 마른 풀을 두껍게 깔아 몸과 땅 사이를 띄운다", ok:true, d:{energy:1}, note:"깐 두께만큼 잠을 잤다. 갇힌 공기가 이불이 됐다." },
    { t:"눈을 단단히 다져 평평한 바닥을 만들고 그 위에 눕는다", ok:false, d:{energy:-1}, note:"다진 눈은 공기가 빠져 열을 훨씬 잘 전한다. 평평해진 대신 체온을 더 빨리 빼앗겼다." },
    { t:"위에 덮을 것을 최대한 두껍게 하고 바닥은 그냥 둔다", ok:false, d:{energy:-1}, note:"체온은 위보다 아래로 훨씬 빨리 빠진다. 덮는 것보다 까는 게 먼저다." },
    { t:"둘이 각자 따로 자리를 잡아 넓게 쓴다", ok:false, d:{energy:-1}, note:"붙어 자면 서로가 난로가 된다. 나눠 잔 밤이 가장 추웠다." },
    { t:"바위 위에 자리를 잡아 젖지 않게 한다", ok:false, d:{energy:-1}, note:"바위는 밤새 열을 빨아들인다. 젖지 않았지만 얼었다." }]},

{ id:"C17", kind:"함정", hard:true, title:"불 앞의 잠",
  body:"불이 잘 타고 있다. 온몸이 노곤해지며 잠이 쏟아진다.",
  choices:[
    { t:"불에서 조금 떨어져 눕고, 번갈아 깨어 불을 지킨다", ok:true, d:{energy:1}, note:"교대로 지킨 덕에 둘 다 무사히 아침을 봤다." },
    { t:"불 바로 옆에 붙어 자면 따뜻하니 그렇게 잔다", ok:false, d:{energy:-1}, note:"잠든 사이 불티가 옷에 붙었다. 감각이 둔해진 몸은 타는 것도 늦게 안다." },
    { t:"불을 크게 키워두고 둘 다 푹 잔다", ok:false, d:{energy:-1}, note:"새벽에 불이 꺼졌고, 아무도 깨어 있지 않았다. 가장 추운 시간에 불이 없었다." },
    { t:"거처 입구를 막고 안에서 불을 피운 채 잔다", ok:false, d:{energy:-1}, note:"환기 없는 곳의 불은 소리 없이 사람을 재운다." },
    { t:"딸만 재우고 아빠가 밤새 불을 지킨다", ok:false, d:{energy:-1}, note:"다음 날 아빠가 아무것도 하지 못했다. 나눴어야 했다." }]},

{ id:"C18", kind:"자원", title:"얼음 아래",
  body:"얼어붙은 개울 아래로 물 흐르는 소리가 난다.",
  choices:[
    { t:"물살이 빠른 곳의 얼음이 얇은 지점을 찾아 깨고 물을 뜬다", ok:true, d:{water:1}, note:"흐르는 물은 얼지 않고 깨끗했다." },
    { t:"깬 구멍을 나뭇가지로 덮어 다시 얼지 않게 해 둔다", ok:true, d:{water:1}, note:"내일 다시 깰 수고를 덜었다." },
    { t:"얼음 위에 서서 가운데를 깬다", ok:false, d:{energy:-1}, note:"가장 얇은 곳 위에 서서 그 얼음을 깼다." },
    { t:"얼음을 떠서 녹여 마시는 게 안전하다", ok:false, d:{energy:-1}, note:"녹이는 데 드는 연료가 아까웠다. 아래에 물이 흐르고 있었다." },
    { t:"소리만 나면 되니 아무 데나 깬다", ok:false, d:{energy:-1}, note:"고인 물 위였다. 깨고 보니 마실 수 없는 것이었다." }]},

{ id:"C19", kind:"자원", title:"겨울의 새",
  body:"눈 위를 걷는 새 몇 마리가 보인다. 잘 날지 않는다.",
  choices:[
    { t:"돌팔매나 막대로 노리고, 잡으면 즉시 손질한다", ok:true, d:{food:1}, note:"이 계절에 가장 잡기 쉬운 사냥감이었다." },
    { t:"올가미를 눈 위에 놓고 미끼를 뿌려 둔다", ok:true, d:{food:1}, note:"미끼 몇 알이 새 한 마리가 됐다." },
    { t:"쫓아가 손으로 잡는다", ok:false, d:{energy:-1}, note:"눈밭에서 뛰는 건 사람이 새보다 훨씬 불리하다." },
    { t:"깃털은 버리고 살만 발라 먹는다", ok:false, d:{energy:-1}, note:"깃털은 이 지역에서 가장 좋은 보온재였다. 버릴 것이 아니었다." },
    { t:"내장은 지저분하니 전부 버린다", ok:false, d:{food:-1}, note:"겨울에는 내장과 지방이 가장 값진 부분이다." }]},

{ id:"C20", kind:"위기", hard:true, title:"가장 추운 시간",
  body:"밤이 깊었다. 하늘이 맑고 별이 유난히 밝다. 바람도 없다.",
  choices:[
    { t:"맑은 밤일수록 더 추워지니 불과 잠자리를 미리 보강한다", ok:true, d:{energy:1}, note:"구름이 없으면 열이 그대로 하늘로 빠져나간다. 미리 대비한 게 맞았다." },
    { t:"바람이 없으니 오늘은 안심하고 잔다", ok:false, d:{energy:-1}, note:"구름 없는 밤이 가장 춥다. 바람이 없다는 것과 따뜻하다는 것은 다른 이야기였다." },
    { t:"별이 밝으니 이참에 밤길을 이동한다", ok:false, d:{energy:-1}, note:"하루 중 가장 추운 시간에 밖에 나가 있었다." },
    { t:"따뜻해 보이니 불을 줄여 연료를 아낀다", ok:false, d:{energy:-1}, note:"새벽 세 시에 불이 필요했는데 없었다." },
    { t:"공기가 차니 거처를 완전히 밀폐한다", ok:false, d:{energy:-1}, note:"밀폐한 안에서 불을 피운 채 잠들었다." }]},

{ id:"C21", kind:"준비", title:"손과 발을 지키는 법",
  body:"장갑도 제대로 된 양말도 없다.",
  choices:[
    { t:"천을 여러 겹 감되 꽉 조이지 않게 여유를 둔다", ok:true, d:{energy:1}, note:"조이지 않은 게 핵심이었다. 피가 돌아야 따뜻하다." },
    { t:"마른 풀과 이끼를 신발 안에 채워 공기층을 만든다", ok:true, d:{energy:1}, note:"사람들이 수천 년 써온 방법이었다." },
    { t:"단단히 조여 찬 공기가 못 들어오게 한다", ok:false, d:{energy:-1}, note:"조인 자리부터 얼었다. 혈액순환을 막는 것이 추위보다 빠르다." },
    { t:"손을 주머니에 넣고 다니며 쓰지 않는다", ok:false, d:{energy:-1}, note:"쓰지 않는 손은 더 차가워진다. 가끔 움직여줘야 했다." },
    { t:"젖으면 체온으로 마르니 그냥 신고 다닌다", ok:false, d:{energy:-1}, note:"젖은 발은 이 지역에서 가장 빠르게 망가진다." }]},

{ id:"C22", kind:"준비", title:"눈 위의 신호",
  body:"흰 눈밭은 하늘에서 아주 잘 보인다. 이 이점을 써야 한다.",
  choices:[
    { t:"눈을 깊게 파서 큰 표시를 만들고 가장자리에 그림자가 지게 한다", ok:true, d:{energy:1}, note:"흰 바탕에서는 그림자가 색을 대신한다." },
    { t:"어두운 나뭇가지나 재를 뿌려 대비를 만든다", ok:true, d:{energy:1}, note:"검은 재 한 줌이 가장 잘 보였다." },
    { t:"흰 눈 위에 밝은 천을 펼쳐 둔다", ok:false, d:{energy:-1}, note:"흰 바탕에 밝은 것은 구별되지 않는다." },
    { t:"표시를 여러 개 작게 나눠 넓게 만든다", ok:false, d:{energy:-1}, note:"작은 표시는 자연 지형처럼 보인다." },
    { t:"눈이 올 때마다 다시 만들면 되니 얕게 파둔다", ok:false, d:{energy:-1}, note:"얕은 표시는 하룻밤 눈에 사라졌다. 깊게 파야 했다." }]},

{ id:"C23", kind:"함정", hard:true, title:"발견한 병",
  body:"버려진 산장에서 술병 하나를 찾았다. 몸을 데울 수 있을 것 같다.",
  choices:[
    { t:"마시지 않고 상처 소독과 불쏘시개용으로만 쓴다", ok:true, d:{energy:1}, note:"쓰임을 바꾼 판단이 정확했다." },
    { t:"추우니 조금씩 나눠 마셔 몸을 덥힌다", ok:false, d:{energy:-1}, note:"알코올은 피부 혈관을 열어 따뜻한 느낌만 준다. 실제로는 열을 몸 밖으로 더 빠르게 내보낸다. 저체온증 사망의 오래된 동반자다." },
    { t:"딸에게는 주지 않고 아빠만 마셔 밤을 버틴다", ok:false, d:{energy:-1}, note:"밤을 지켜야 할 사람의 판단이 흐려졌다." },
    { t:"따뜻하게 데워 마시면 괜찮다", ok:false, d:{energy:-1}, note:"온도의 문제가 아니라 성분의 문제였다." },
    { t:"물에 섞어 조금씩 마신다", ok:false, d:{energy:-1}, note:"희석해도 같은 일이 일어난다." }]},

{ id:"C24", kind:"자원", title:"쓰러진 짐승",
  body:"눈 속에 사슴 한 마리가 죽어 있다. 얼어 있어 상하지 않은 것 같다.",
  choices:[
    { t:"겉을 살펴 사냥당한 흔적이 있는지 확인하고, 없으면 손대지 않는다", ok:true, d:{energy:1}, note:"이유를 모르는 죽음은 먹지 않았다." },
    { t:"근처에 다른 짐승의 흔적이 있는지 먼저 살핀다", ok:true, d:{energy:1}, note:"주인이 있는 먹이일 수 있었다. 실제로 큰 발자국이 있었다." },
    { t:"얼어 있으니 상하지 않았다. 잘라 가져간다", ok:false, d:{food:-1}, note:"얼음은 보존할 뿐 병을 없애지 않는다. 죽은 이유는 그대로 남아 있다." },
    { t:"내장만 피하고 살코기만 발라 먹는다", ok:false, d:{food:-1}, note:"병원체는 부위를 가리지 않는다." },
    { t:"오래 끓여 먹으면 안전하다", ok:false, d:{food:-1}, note:"열로 해결되지 않는 것들이 있다. 게다가 이 고기를 끓이느라 연료를 다 썼다." }]},

{ id:"C25", kind:"위기", title:"비탈의 눈",
  body:"가파른 비탈 아래를 지나야 한다. 위쪽에 눈이 두껍게 얹혀 있다.",
  choices:[
    { t:"비탈 아래를 지나지 않고 능선을 따라 돌아간다", ok:true, d:{energy:1}, note:"멀리 돌았고 살았다." },
    { t:"지나야 한다면 한 사람씩 간격을 두고 빠르게 건넌다", ok:true, d:{energy:1}, note:"둘이 동시에 묻히지 않게 했다." },
    { t:"둘이 붙어서 함께 빠르게 지나간다", ok:false, d:{energy:-1}, note:"한 번에 둘 다 아래에 있었다." },
    { t:"소리를 내지 않고 조용히 지나간다", ok:false, d:{energy:-1}, note:"소리로 눈사태가 나는 건 영화 속 이야기다. 문제는 발밑의 하중이었다." },
    { t:"비탈 한가운데를 가로질러 최단거리로 간다", ok:false, d:{energy:-1}, note:"가장 위험한 선을 골랐다." }]},

{ id:"C26", kind:"위기", title:"발자국을 따라오는 것",
  body:"돌아보니 멀찍이서 개처럼 생긴 짐승 몇 마리가 따라오고 있다.",
  choices:[
    { t:"불을 만들고 둘이 붙어 서서 크게 소리를 낸다", ok:true, d:{energy:1}, note:"무리는 만만해 보이는 쪽을 고른다." },
    { t:"등을 나무나 바위에 붙여 뒤를 막고 막대를 든다", ok:true, d:{energy:1}, note:"둘러싸이지 않는 것이 전부였다." },
    { t:"잡은 고기를 던져 주고 그 사이 떠난다", ok:false, d:{food:-1}, note:"먹이를 준 순간 무리는 계속 따라왔다." },
    { t:"등을 보이고 빠르게 걸어 벗어난다", ok:false, d:{energy:-1}, note:"등을 보인 순간 거리가 좁혀졌다." },
    { t:"나무 위로 올라가 지나가길 기다린다", ok:false, d:{energy:-1}, note:"올라간 채로 밤을 맞았다. 추위가 짐승보다 먼저 왔다." }]},

{ id:"C27", kind:"준비", title:"눈 위를 걷는 법",
  body:"발이 무릎까지 푹푹 빠진다. 얼마 못 가 숨이 찬다.",
  choices:[
    { t:"나뭇가지를 엮어 발에 매는 넓은 판을 만든다", ok:true, d:{energy:1}, note:"체중이 퍼지자 빠지지 않았다." },
    { t:"한 사람이 앞서 길을 내고 뒷사람이 그 자국을 밟으며 교대한다", ok:true, d:{energy:1}, note:"교대가 두 사람의 체력을 살렸다." },
    { t:"힘이 있을 때 앞사람이 계속 앞장선다", ok:false, d:{energy:-1}, note:"앞장서는 쪽의 소모가 두 배다. 한 사람만 무너졌다." },
    { t:"눈이 얕은 능선 대신 골짜기로 간다", ok:false, d:{energy:-1}, note:"골짜기는 눈이 쌓이는 곳이다. 반대로 갔다." },
    { t:"체온을 올리려 속도를 낸다", ok:false, d:{energy:-1}, note:"땀이 났고, 그 땀이 멈춘 순간 얼었다." }]},

{ id:"C28", kind:"몸", hard:true, title:"땀",
  body:"나무를 하고 났더니 등이 축축하다. 몸은 뜨거운데 바람이 분다.",
  choices:[
    { t:"일하기 전에 겉옷을 벗고, 땀이 나기 시작하면 속도를 늦춘다", ok:true, d:{energy:1}, note:"추운 곳에서 땀은 적이다. 미리 벗는 것이 규칙이었다." },
    { t:"땀이 났으니 옷을 더 입어 식지 않게 한다", ok:false, d:{energy:-1}, note:"젖은 옷 위에 덮으면 습기가 갇힌다. 벗어서 말렸어야 했다." },
    { t:"땀은 몸이 데워졌다는 뜻이니 계속 일한다", ok:false, d:{energy:-1}, note:"일이 끝난 순간 젖은 옷이 몸을 식혔다. 추운 곳에서 땀은 나중에 청구되는 빚이다." },
    { t:"불 앞에서 옷째로 말린다", ok:false, d:{energy:-1}, note:"겉만 마르고 안은 젖은 채였다." },
    { t:"땀이 마를 때까지 움직이지 않고 서 있는다", ok:false, d:{energy:-1}, note:"바람 앞에 젖은 채 서 있었다. 가장 빠르게 체온을 잃는 자세였다." }]},

{ id:"C29", kind:"몸", hard:true, title:"눈이 아프다",
  body:"온종일 눈밭을 걸었다. 저녁이 되자 눈이 시리고 모래가 들어간 것처럼 아프다.",
  choices:[
    { t:"천이나 나무껍질에 가는 틈을 내어 눈가리개를 만들어 쓴다", ok:true, d:{energy:1}, note:"이누이트가 쓰던 방법이었다. 틈으로만 보게 하자 나아졌다." },
    { t:"눈을 감고 쉬면 저절로 낫는다", ok:false, d:{energy:-1}, note:"설맹은 각막이 햇볕에 탄 것이다. 쉬면 회복되지만, 대책 없이 다음 날 또 나가면 같은 일이 반복된다." },
    { t:"눈을 비벼 이물감을 없앤다", ok:false, d:{energy:-1}, note:"탄 각막을 문질렀다." },
    { t:"찬 눈을 눈에 대어 식힌다", ok:false, d:{energy:-1}, note:"차게 하는 것과 낫는 것은 다르다. 눈꺼풀까지 얼 뻔했다." },
    { t:"흐린 날에는 괜찮으니 흐린 날만 이동한다", ok:false, d:{energy:-1}, note:"흐린 날에도 눈밭의 반사광은 강하다. 오히려 방심해서 더 오래 노출됐다." }]},

{ id:"C30", kind:"몸", title:"기침",
  body:"딸이 마른기침을 계속한다. 밤에 더 심해진다.",
  choices:[
    { t:"천으로 코와 입을 느슨하게 가려 찬 공기가 덜 들어가게 한다", ok:true, d:{energy:1}, note:"들어오는 공기를 덥히자 잦아들었다." },
    { t:"따뜻한 물과 솔잎 차를 자주 마시게 한다", ok:true, d:{water:1}, note:"습기와 온기가 목을 달랬다." },
    { t:"찬 공기가 좋으니 밖에서 깊게 숨 쉬게 한다", ok:false, d:{energy:-1}, note:"찬 건조한 공기가 원인이었다. 원인을 더 넣었다." },
    { t:"불 가까이 앉혀 연기를 쐬게 한다", ok:false, d:{energy:-1}, note:"연기가 기도를 더 자극했다." },
    { t:"기침은 저절로 낫는 것이니 그대로 둔다", ok:false, d:{energy:-1}, note:"잠을 못 자는 밤이 이어지자 다른 것들이 무너지기 시작했다." }]},

{ id:"C31", kind:"자원", title:"덫",
  body:"쫓아다니는 사냥으로는 체력이 남지 않는다.",
  choices:[
    { t:"짐승 길목에 올가미를 여러 개 놓고 매일 아침 돌아본다", ok:true, d:{food:1}, note:"덫은 자는 동안에도 일했다." },
    { t:"덫에 사람 냄새가 남지 않게 연기를 쐬어 둔다", ok:true, d:{food:1}, note:"냄새를 지우자 걸리기 시작했다." },
    { t:"좋은 자리 한 곳에 덫을 몰아 놓는다", ok:false, d:{food:-1}, note:"한 곳이 비면 전부가 빈다. 흩어 놓는 게 원칙이다." },
    { t:"매일 자리를 옮겨 새로운 곳에 놓는다", ok:false, d:{energy:-1}, note:"짐승이 익숙해질 시간을 주지 않았다. 옮기는 데 체력만 썼다." },
    { t:"큰 짐승용으로 크게 만들어 한 번에 크게 얻는다", ok:false, d:{energy:-1}, note:"만드는 데 며칠이 걸렸고 아무것도 걸리지 않았다. 작은 것 여럿이 나았다." }]},

{ id:"C32", kind:"자원", hard:true, title:"얼음낚시",
  body:"얼어붙은 호수 위에 구멍을 뚫으면 물고기를 잡을 수 있을 것 같다.",
  choices:[
    { t:"물가 가까운 얕은 곳에서 얼음 두께를 확인한 뒤 구멍을 낸다", ok:true, d:{food:1}, note:"멀리 나가지 않고 얻었다." },
    { t:"물고기가 많은 호수 한가운데로 나가 구멍을 낸다", ok:false, d:{energy:-1}, note:"한가운데가 가장 늦게 얼고 가장 먼저 녹는다. 물고기보다 얼음을 먼저 생각했어야 했다." },
    { t:"얼음이 얇은 곳이 구멍 내기 쉬우니 그곳을 고른다", ok:false, d:{energy:-1}, note:"쉬운 곳이 곧 위험한 곳이었다." },
    { t:"구멍을 크게 내야 잘 잡히니 넓게 깬다", ok:false, d:{energy:-1}, note:"넓게 깬 얼음 위에 서 있었다." },
    { t:"뚫은 구멍 옆에 앉아 오래 기다린다", ok:false, d:{energy:-1}, note:"얼음 위에 앉아 몇 시간을 있었다. 잡은 것보다 잃은 체온이 컸다." }]},

{ id:"C33", kind:"준비", title:"물통이 언다",
  body:"아침마다 물통이 꽁꽁 얼어 있다.",
  choices:[
    { t:"밤에는 물통을 뒤집어 두어 입구가 얼지 않게 한다", ok:true, d:{water:1}, note:"물은 위부터 언다. 뒤집으니 입구가 살아 있었다." },
    { t:"잘 때 물통을 잠자리 안쪽 몸 가까이 둔다", ok:true, d:{water:1}, note:"체온이 통을 지켰다." },
    { t:"밖에 두면 시원하니 그대로 둔다", ok:false, d:{water:-1}, note:"통이 얼어 터졌다. 물도 통도 잃었다." },
    { t:"물을 가득 채워 두면 잘 얼지 않는다", ok:false, d:{water:-1}, note:"가득 찬 통이 얼면서 부풀어 터졌다. 여유를 뒀어야 했다." },
    { t:"불 옆에 두어 얼지 않게 한다", ok:false, d:{water:-1}, note:"밤중에 불이 사그라들자 그대로 얼었고, 그을음까지 섞였다." }]},

{ id:"C34", kind:"준비", title:"땔감",
  body:"매일 밤 불이 필요하다. 나무는 많지만 다 얼어 있다.",
  choices:[
    { t:"서서 죽은 나무를 골라 벤다. 땅에 닿지 않아 속이 말라 있다", ok:true, d:{energy:1}, note:"서서 죽은 나무가 이 지역의 마른 장작이었다." },
    { t:"하루 쓸 양의 두 배를 미리 모아 거처 안에서 말려 둔다", ok:true, d:{energy:1}, note:"내일의 불을 오늘 준비했다." },
    { t:"눈 위에 쓰러져 있는 나무를 모은다", ok:false, d:{energy:-1}, note:"눈에 닿은 나무는 속까지 젖어 있다. 불이 붙지 않았다." },
    { t:"살아 있는 나무가 굵고 좋으니 그것을 벤다", ok:false, d:{energy:-1}, note:"생나무는 타지 않는다. 하루를 베는 데 쓰고 밤에 떨었다." },
    { t:"그날 쓸 만큼만 매일 모은다", ok:false, d:{energy:-1}, note:"눈보라가 온 날 아무것도 못 모았고, 그날 밤이 가장 추웠다." }]},

{ id:"C35", kind:"심리", title:"밤이 너무 길다",
  body:"해가 짧다. 어두워지면 할 수 있는 게 없고, 밤은 끝없이 길다.",
  choices:[
    { t:"어둠 속에서 할 수 있는 일을 정해 둔다. 이야기, 끈 꼬기, 계획 세우기", ok:true, d:{morale:1}, note:"손과 입이 움직이자 밤이 짧아졌다." },
    { t:"매일 밤 같은 순서로 하는 일과를 만든다", ok:true, d:{morale:1}, note:"반복이 시간을 나눠줬다." },
    { t:"어두우면 할 게 없으니 일찍 자고 오래 잔다", ok:false, d:{morale:-1}, note:"열네 시간을 누워 있으면 잠이 아니라 무기력이 된다." },
    { t:"불을 크게 피워 밤을 낮처럼 만든다", ok:false, d:{energy:-1}, note:"며칠치 연료를 하룻밤에 태웠다." },
    { t:"밤에도 일을 해서 시간을 채운다", ok:false, d:{energy:-1}, note:"쉴 시간까지 일이 됐다. 며칠 만에 몸이 무너졌다." }]},

{ id:"C36", kind:"심리", title:"딸이 춥다고 한다",
  body:"딸이 계속 춥다고 한다. 해줄 수 있는 게 다 떨어진 것 같다.",
  choices:[
    { t:"붙어 앉아 체온을 나누고, 따뜻한 물을 손에 쥐게 한다", ok:true, d:{morale:1}, note:"손에 쥔 따뜻한 것 하나가 컸다." },
    { t:"몸을 움직이는 일을 함께 해 스스로 열을 내게 한다", ok:true, d:{morale:1}, note:"움직이자 실제로 따뜻해졌다." },
    { t:"참으라고 하고 더 말하지 못하게 한다", ok:false, d:{morale:-1}, note:"춥다는 말은 신호다. 신호를 껐다." },
    { t:"아빠 옷을 벗어 전부 입혀 준다", ok:false, d:{energy:-1}, note:"아빠가 떨기 시작했다. 둘 다 위험해졌다." },
    { t:"내일은 따뜻해질 거라고 말해준다", ok:false, d:{morale:-1}, note:"다음 날 더 추웠다." }]},

{ id:"C37", kind:"심리", title:"움직이기 싫다",
  body:"딸이 며칠째 잠자리에서 나오지 않으려 한다. 춥고 할 게 없다는 것이다.",
  choices:[
    { t:"아주 작은 일 하나를 정해 함께 하고, 끝나면 다시 들어가게 한다", ok:true, d:{morale:1}, note:"시작이 작으면 일어날 수 있다." },
    { t:"하루에 한 번은 반드시 밖에 나가 해를 보기로 정한다", ok:true, d:{morale:1}, note:"짧은 해를 놓치지 않는 것이 규칙이 됐다." },
    { t:"체력을 아끼는 게 좋으니 그대로 두게 한다", ok:false, d:{morale:-1}, note:"누워 있는 시간이 길어질수록 일어나기 어려워진다." },
    { t:"억지로 끌어내 일을 시킨다", ok:false, d:{morale:-1}, note:"밀어낸 만큼 더 깊이 들어갔다." },
    { t:"혼자 두고 아빠가 다 처리한다", ok:false, d:{energy:-1}, note:"한 사람 몫으로 두 사람이 살았다. 오래가지 못했다." }]},

{ id:"C38", kind:"심리", title:"오늘이 며칠인지",
  body:"해가 짧고 날씨가 비슷해 며칠이 지났는지 감이 없다.",
  choices:[
    { t:"매일 아침 나무에 금을 하나씩 긋는 일을 딸에게 맡긴다", ok:true, d:{morale:1}, note:"기록하는 사람이 되자 아침이 생겼다." },
    { t:"해가 뜨고 지는 시각의 변화를 함께 기록한다", ok:true, d:{morale:1}, note:"해가 조금씩 길어지는 게 보이자 둘 다 달라졌다." },
    { t:"날짜는 중요하지 않으니 세지 않는다", ok:false, d:{morale:-1}, note:"시간이 뭉개지자 하루가 무너지고 그다음 하루도 무너졌다." },
    { t:"눈이 녹으면 봄이니 그때 세면 된다", ok:false, d:{morale:-1}, note:"기준이 너무 멀었다. 오늘을 셀 수 없으면 오늘을 살 수 없다." },
    { t:"기억해두었다가 나중에 한꺼번에 표시한다", ok:false, d:{morale:-1}, note:"닷새가 이틀로 줄어 있었다." }]},

{ id:"C39", kind:"심리", title:"딸의 첫 사냥",
  body:"딸이 놓은 덫에 처음으로 짐승이 걸렸다. 그런데 딸이 그 앞에서 울고 있다.",
  choices:[
    { t:"슬퍼하는 게 당연하다고 말해주고, 손질은 아빠가 한다", ok:true, d:{morale:1}, note:"감정을 인정하되 짐은 나눠 졌다." },
    { t:"이 짐승 덕분에 오늘을 산다고 말하고 함께 감사를 표한다", ok:true, d:{morale:1}, note:"죽음에 의미를 붙여줬다." },
    { t:"살려면 익숙해져야 한다고 말하고 손질을 시킨다", ok:false, d:{morale:-1}, note:"익숙해진 게 아니라 무뎌졌다. 그 뒤로 덫을 확인하러 가지 않았다." },
    { t:"별일 아니라고 웃어넘긴다", ok:false, d:{morale:-1}, note:"딸에게는 별일이었다." },
    { t:"덫 놓는 일을 다시 아빠가 맡는다", ok:false, d:{morale:-1}, note:"해냈다는 사실까지 함께 거둬 갔다." }]},

{ id:"C40", kind:"심리", title:"싸움",
  body:"사소한 일로 언성이 높아졌다. 좁은 거처 안에서 종일 함께 있다 보니 그렇다.",
  choices:[
    { t:"각자 밖에서 잠깐 다른 일을 하고 오기로 한다", ok:true, d:{morale:1}, note:"떨어져 있을 시간이 필요했다. 다만 서로 보이는 거리에서." },
    { t:"하루에 한 번은 각자 혼자 있는 시간을 정해 둔다", ok:true, d:{morale:1}, note:"규칙이 되자 싸울 일이 줄었다." },
    { t:"지금 확실히 짚고 넘어간다", ok:false, d:{morale:-1}, note:"춥고 배고픈 상태의 대화는 어디에도 이르지 못한다." },
    { t:"아빠가 무조건 참고 넘어간다", ok:false, d:{morale:-1}, note:"참은 것이 쌓여 다음번에 더 크게 터졌다." },
    { t:"멀리 떨어져 각자 시간을 보낸다", ok:false, d:{energy:-1}, note:"이 지형에서 떨어지는 건 감정 문제가 아니라 안전 문제였다." }]},

{ id:"C41", kind:"심리", title:"봄",
  body:"딸이 언제 따뜻해지냐고 묻는다. 아빠도 모른다.",
  choices:[
    { t:"모른다고 솔직히 말하되, 해가 길어지고 있다는 걸 함께 확인한다", ok:true, d:{morale:1}, note:"모른다는 말과 근거 있는 희망을 같이 줬다." },
    { t:"봄이 오면 하고 싶은 일을 하나씩 말해보게 한다", ok:true, d:{morale:1}, note:"기다릴 이유를 아이가 직접 만들었다." },
    { t:"곧 따뜻해질 거라고 말한다", ok:false, d:{morale:-1}, note:"곧이 오지 않자 다음 말도 믿지 않게 됐다." },
    { t:"그런 건 생각하지 말라고 한다", ok:false, d:{morale:-1}, note:"기다릴 것이 없으면 오늘을 견딜 이유도 없다." },
    { t:"아직 한참 남았다고 사실대로 못 박는다", ok:false, d:{morale:-1}, note:"사실이었지만 그것만 줬다. 딸은 그날 저녁 아무것도 먹지 않았다." }]},

{ id:"C42", kind:"심리", title:"한 벌뿐인 담요",
  body:"제대로 된 담요가 하나뿐이다. 매일 밤 누가 덮을지가 문제다.",
  choices:[
    { t:"둘이 붙어서 함께 덮고 잔다", ok:true, d:{morale:1}, note:"나누는 게 아니라 합치는 문제였다." },
    { t:"담요는 함께 덮고, 그 아래 깔 것을 더 만들기로 한다", ok:true, d:{morale:1}, note:"부족한 걸 나누는 대신 늘렸다." },
    { t:"딸에게 주고 아빠는 옷으로 버틴다", ok:false, d:{energy:-1}, note:"며칠 만에 아빠가 앓아누웠다. 딸은 그 담요를 덮을 때마다 죄책감을 느꼈다." },
    { t:"하루씩 번갈아 덮기로 정한다", ok:false, d:{energy:-1}, note:"둘 다 이틀에 한 번씩 못 잤다." },
    { t:"딸이 아빠에게 양보하겠다고 하니 받는다", ok:false, d:{morale:-1}, note:"어른이 정했어야 할 선이었다." }]},

{ id:"C43", kind:"함정", title:"산장",
  body:"버려진 산장을 찾았다. 문이 반쯤 부서졌고 안에 난로와 낡은 통조림이 있다.",
  choices:[
    { t:"난로와 굴뚝이 막히지 않았는지 확인한 뒤에 불을 피운다", ok:true, d:{energy:1}, note:"새 둥지가 굴뚝을 막고 있었다. 확인이 살렸다." },
    { t:"멀쩡한 통조림만 골라 열고 확인한 뒤 먹는다", ok:true, d:{food:1}, note:"고르는 판단이 정확했다." },
    { t:"추우니 문부터 막고 바로 불을 피운다", ok:false, d:{energy:-1}, note:"막힌 굴뚝과 막은 문 사이에서 연기가 갇혔다." },
    { t:"뚜껑이 부푼 통조림도 얼어 있었으니 괜찮다", ok:false, d:{food:-1}, note:"부푼 통조림은 균이 이미 활동했다는 신호다. 얼었다고 없던 일이 되지 않는다." },
    { t:"사람이 살던 곳이니 곧 누가 온다. 여기서 기다린다", ok:false, d:{food:-1}, note:"부서진 문은 오래 아무도 오지 않았다는 뜻이었다." }]},

{ id:"C44", kind:"함정", hard:true, title:"평평한 눈밭",
  body:"넓고 평평한 눈밭이 펼쳐진다. 걷기 좋아 보인다.",
  choices:[
    { t:"막대로 앞을 찔러 확인하며 가장자리를 따라 돌아간다", ok:true, d:{energy:1}, note:"세 번째 찌름에서 막대가 쑥 들어갔다. 아래는 물이었다." },
    { t:"평평하니 최단거리로 곧장 가로지른다", ok:false, d:{energy:-1}, note:"평평하고 나무가 없는 눈밭은 대개 얼어붙은 물 위다. 걷기 좋다는 게 경고였다." },
    { t:"딸을 먼저 보내 안전한지 확인한다", ok:false, d:{energy:-1}, note:"가장 가벼운 사람을 먼저 보내는 건 얼음 위에서 통하는 논리가 아니다. 확인은 어른이 도구로 해야 했다." },
    { t:"눈이 두껍게 쌓였으니 그 아래도 두껍게 얼었을 것이다", ok:false, d:{energy:-1}, note:"눈은 이불처럼 덮어 얼음을 얼지 못하게 한다. 두꺼운 눈 아래가 가장 얇았다." },
    { t:"뛰어서 빨리 지나가면 하중이 덜 실린다", ok:false, d:{energy:-1}, note:"뛰는 발이 걷는 발보다 몇 배 큰 힘으로 내리찍는다." }]},

{ id:"C45", kind:"함정", hard:true, title:"따뜻해졌다",
  body:"밤새 떨던 딸이 갑자기 덥다며 옷을 벗으려 한다.",
  choices:[
    { t:"못 벗게 막고 즉시 바람을 막은 뒤 몸통부터 데운다", ok:true, d:{energy:1}, note:"저체온증이 깊어지면 오히려 덥다고 느낀다. 옷을 벗는 것은 마지막 단계의 신호다." },
    { t:"덥다고 하니 조금 벗겨 식혀 준다", ok:false, d:{energy:-1}, note:"실제로 더운 게 아니라 몸의 온도 감각이 무너진 것이었다." },
    { t:"땀이 났나 보다 하고 겉옷만 벗겨 말린다", ok:false, d:{energy:-1}, note:"땀이 아니었다. 판단할 시간이 없는 상황이었다." },
    { t:"열이 나는 것이니 이마를 식혀 준다", ok:false, d:{energy:-1}, note:"열이 아니라 반대였다." },
    { t:"기운이 도는 신호이니 그대로 재운다", ok:false, d:{energy:-1}, note:"이 상태에서 재우면 다시 깨지 못할 수 있다." }]},

{ id:"C46", kind:"함정", title:"맑은 얼음물",

/* ── 지형 등록 ─────────────────────────────────── */
const TERRAINS = {
  jungle: { name:"정글", desc:"물과 자원이 많다 · 밤에는 모기가 문제다",
            pool:JUNGLE, events:JUNGLE_EVENTS, tone:"jungle" },
  desert: { name:"사막", desc:"물이 귀하다 · 밤이 춥지 않고 사냥이 된다",
            pool:DESERT, events:DESERT_EVENTS, tone:"desert" },
  sea:    { name:"바다", desc:"물고기와 표류물 · 폭우에 거처가 쓸려간다",
            pool:SEA, events:SEA_EVENTS, tone:"sea" },
  cold:   { name:"추위", desc:"식량이 오래 간다 · 정답이 하나뿐인 상황이 많다",
            pool:COLD, events:COLD_EVENTS, tone:"cold" },
};
const ORDER = ["jungle","desert","sea","cold"];

/* ── 유틸 ─────────────────────────────────────── */
const clamp = n => Math.max(0, Math.min(MAX, n));
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
const LABEL = { energy:"체력", food:"식량", water:"물", morale:"사기" };
const deltaText = d => Object.keys(d).map(k => LABEL[k]+" "+(d[k]>0?"+":"−")+Math.abs(d[k])).join(" · ");

// 상황 하나를 뽑을 때 선택지 순서를 섞은 사본을 만든다 (원본 데이터는 그대로)
function pickScenes(pool, n){
  return shuffle(pool).slice(0, n).map(function(sc){
    return { id:sc.id, kind:sc.kind, title:sc.title, body:sc.body,
             choices: shuffle(sc.choices) };
  });
}
function buildDeck(key){
  let deck = pickScenes(TERRAINS[key].pool, DRAW_HOME);
  for (const k of ORDER){
    if (k === key) continue;
    deck = deck.concat(pickScenes(TERRAINS[k].pool, DRAW_AWAY_EACH));
  }
  return shuffle(deck);
}

/* ── 상태 ─────────────────────────────────────── */
let S = {};
function reset(){
  S = { screen:"title", terrain:"jungle", energy:3, food:2, water:2, morale:3, done:0,
        deck:[], scene:null, event:null, result:null, dayEnd:null, wrong:0 };
}
reset();

function startGame(key){
  const d = buildDeck(key);
  S = { screen:"play", terrain:key, energy:3, food:2, water:2, morale:3, done:0,
        deck:d.slice(1), scene:d[0], event:null, result:null, dayEnd:null, wrong:0 };
  document.body.dataset.tone = TERRAINS[key].tone;
  render();
}

const day  = () => Math.min(TOTAL_DAYS, Math.floor(S.done / ACTIONS_PER_DAY) + 1);
const slot = () => SLOT[S.done % ACTIONS_PER_DAY];

function applyDelta(d){
  S.energy = clamp(S.energy + (d.energy||0));
  S.food   = clamp(S.food   + (d.food||0));
  S.water  = clamp(S.water  + (d.water||0));
  S.morale = clamp(S.morale + (d.morale||0));
}

/* ── 진행 ─────────────────────────────────────── */
function choose(i){
  if (S.result) return;
  const c = S.scene.choices[i];
  applyDelta(c.d);
  if (!c.ok) S.wrong++;
  S.result = { index:i, ok:c.ok, note:c.note, d:c.d, dead:S.energy <= 0 };
  render();
}

function proceed(){
  if (S.result.dead){ S.result=null; S.screen="dead"; render(); return; }
  S.result = null;
  S.done++;

  if (S.done % ACTIONS_PER_DAY === 0){
    const lines = [];
    if (S.food >= 1){ S.food--; lines.push("식량 1을 먹었다."); }
    else { S.energy--; lines.push("먹을 것이 없었다. 체력 −1"); }
    if (S.water >= 1){ S.water--; lines.push("물 1을 마셨다."); }
    else { S.energy--; lines.push("마실 물이 없었다. 체력 −1"); }

    if (S.terrain === "cold"){ S.energy--; lines.push("밤새 추위가 체력을 가져갔다. 체력 −1"); }

    if (S.morale <= 0){ S.energy--; lines.push("딸이 자리에서 일어나지 못했다. 체력 −1"); }
    else if (S.morale >= MAX){
      if (Math.random() < 0.5){ S.food = Math.min(MAX, S.food+1); lines.push("딸이 혼자 먹을 것을 구해 왔다. 식량 +1"); }
      else { S.water = Math.min(MAX, S.water+1); lines.push("딸이 혼자 물을 길어 왔다. 물 +1"); }
    }
    S.energy = clamp(S.energy);

    S.dayEnd = {
      day: Math.floor((S.done - 1) / ACTIONS_PER_DAY) + 1,
      lines: lines,
      dead: S.energy <= 0,
      win: S.done >= TOTAL_ACTIONS && S.energy > 0
    };
    render();
    return;
  }
  step();
}

function closeDay(){
  const info = S.dayEnd;
  S.dayEnd = null;
  if (info.dead){ S.screen="dead"; render(); return; }
  if (info.win){ S.screen="win"; render(); return; }
  step();
}

function step(){
  if (Math.random() < 0.18){ const E=TERRAINS[S.terrain].events; S.event = E[Math.floor(Math.random()*E.length)]; }
  else { draw(); }
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
}

function draw(){
  if (S.deck.length === 0) S.deck = buildDeck(S.terrain);
  S.scene = S.deck[0];
  S.deck = S.deck.slice(1);
}

function closeEvent(){
  applyDelta(S.event.d);
  S.event = null;
  if (S.energy <= 0){ S.screen="dead"; render(); return; }
  draw();
  render();
}

/* ── 렌더 조각 ─────────────────────────────────── */
function meter(label, value, tone){
  let pips = "";
  for (let i=0;i<MAX;i++) pips += '<i class="pip'+(i<value?" on "+tone:"")+'"></i>';
  return '<div class="meter"><span class="meter-label">'+label+'</span>'+
         '<span class="pips">'+pips+'</span><span class="meter-num">'+value+'</span></div>';
}
const meters = () => meter("체력",S.energy,"e")+meter("식량",S.food,"f")+meter("물",S.water,"w")+meter("사기",S.morale,"m");

function strip(done){
  let h = '<div class="strip">';
  for (let d=0; d<TOTAL_DAYS; d++){
    h += '<span class="strip-day">';
    for (let s=0; s<ACTIONS_PER_DAY; s++){
      const idx = d*ACTIONS_PER_DAY + s;
      h += '<i class="tick'+(idx<done?" past":"")+(idx===done?" now":"")+'"></i>';
    }
    h += '</span>';
  }
  return h + '</div>';
}

/* ── 렌더 ─────────────────────────────────────── */
function render(){
  let h = "";

  if (S.screen === "title"){
    h += '<div class="title">'+
      '<p class="eyebrow">아빠와 딸 · 열흘</p>'+
      '<h1>개복치<br><span>무인도</span></h1>'+
      '<p class="tag">한 번의 오판이 하루를 갉아먹는다.<br>체력이 0이 되면 그것으로 끝이다.</p>'+
      '<div class="terrains">'+
      ORDER.map(function(k){
        const t = TERRAINS[k];
        return '<button class="terrain t-'+k+'" data-act="start" data-t="'+k+'">'+
          '<span class="tname">'+t.name+'</span>'+
          '<span class="tdesc">'+t.desc+'</span>'+
          '<span class="tgo">'+(k==="cold"?"어려움 →":"시작 →")+'</span></button>';
      }).join("")+
      '</div>'+
      '<p class="rules">하루 3번 행동 · 10일을 버티면 구조<br>'+
      '하루 끝에 식량과 물을 1씩 쓴다 · 모자란 만큼 체력이 깎인다<br>'+
      '사기 0이면 체력이 깎이고, 사기 5면 딸이 제 몫을 한다<br>'+
      '자원은 5까지만 지닐 수 있다 · 추위 지형은 매일 체력이 1씩 더 깎인다</p>'+
      '<p class="ver">v1.2 · 선택지 위치는 매판 무작위로 섞입니다</p></div>';
  }

  if (S.screen === "play" && S.scene){
    h += '<header class="hud">'+ strip(S.done) +
      '<div class="hud-row"><span class="daynow">'+TERRAINS[S.terrain].name+' · '+day()+'일차 '+slot()+'</span>'+
      '<span class="left">남은 행동 '+(TOTAL_ACTIONS - S.done)+'</span></div>'+
      '<div class="meters">'+ meters() +'</div></header>';

    h += '<main class="scene"><p class="scode">'+S.scene.id+' · '+S.scene.kind+'</p>'+
      '<h2>'+S.scene.title+'</h2><p class="sbody">'+S.scene.body+'</p><ul class="choices">';
    S.scene.choices.forEach(function(c, i){
      let cls = "";
      if (S.result) cls = (S.result.index === i) ? (c.ok ? " hit" : " miss") : " dim";
      h += '<li><button class="choice'+cls+'" data-act="choose" data-i="'+i+'"'+
           (S.result ? " disabled" : "")+'>'+
           '<span class="cnum">'+(i+1)+'</span><span class="ctext">'+c.t+'</span></button></li>';
    });
    h += '</ul></main>';
  }

  if (S.result){
    h += '<div class="sheet"><div class="panel '+(S.result.ok?"good":"bad")+'">'+
      '<p class="verdict">'+(S.result.ok?"살아남았다":"판단 착오")+'</p>'+
      '<p class="pnote">'+S.result.note+'</p>'+
      '<p class="pdelta">'+deltaText(S.result.d)+'</p>'+
      '<button class="cta" data-act="proceed">'+(S.result.dead?"…":"계속")+'</button></div></div>';
  }

  if (S.event){
    h += '<div class="sheet"><div class="panel '+(S.event.good?"good":"bad")+'">'+
      '<p class="verdict">뜻밖의 일</p><h3 class="etitle">'+S.event.title+'</h3>'+
      '<p class="pnote">'+S.event.body+'</p>'+
      '<p class="pdelta">'+deltaText(S.event.d)+' · 시간은 흐르지 않는다</p>'+
      '<button class="cta" data-act="event">확인</button></div></div>';
  }

  if (S.dayEnd){
    h += '<div class="sheet"><div class="panel day">'+
      '<p class="verdict">'+S.dayEnd.day+'일차가 끝났다</p>'+
      S.dayEnd.lines.map(function(l){ return '<p class="pnote">'+l+'</p>'; }).join("")+
      '<div class="daymeters">'+ meters() +'</div>'+
      '<button class="cta" data-act="day">'+
      (S.dayEnd.win?"아침이 온다":(S.dayEnd.dead?"…":(S.dayEnd.day+1)+"일차"))+
      '</button></div></div>';
  }

  if (S.screen === "dead"){
    h += '<div class="end dead"><p class="eyebrow">'+TERRAINS[S.terrain].name+' · '+day()+'일차 '+slot()+'</p>'+
      '<h1>여기까지</h1>'+
      '<p class="tag">체력이 바닥났다. 큰 실수 하나가 아니라<br>작은 오판 몇 번이 사람을 잡는다.</p>'+
      '<p class="stat">버틴 날 '+Math.max(1,Math.ceil(S.done/ACTIONS_PER_DAY))+'일 · 행동 '+S.done+'회 · 오답 '+S.wrong+'회</p>'+
      '<button class="cta wide" data-act="start" data-t="'+S.terrain+'">같은 지형 다시</button>'+
      '<button class="ghost" data-act="title">지형 고르기</button></div>';
  }

  if (S.screen === "win"){
    h += '<div class="end win"><p class="eyebrow">'+TERRAINS[S.terrain].name+' · 10일차 저녁</p><h1>구조</h1>'+
      '<p class="tag">수평선에서 빛이 번쩍인다. 딸이 먼저 알아본다.<br>열흘을 버텼고, 둘 다 살아 있다.</p>'+
      '<p class="stat">체력 '+S.energy+' · 식량 '+S.food+' · 물 '+S.water+' · 사기 '+S.morale+' · 오답 '+S.wrong+'회</p>'+
      '<button class="cta wide" data-act="start" data-t="'+S.terrain+'">다시 도전</button>'+
      '<button class="ghost" data-act="title">지형 고르기</button></div>';
  }

  document.getElementById("app").innerHTML = h;
}

/* ── 입력 ─────────────────────────────────────── */
document.getElementById("app").addEventListener("click", function(e){
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "start") startGame(b.dataset.t);
  else if (act === "title"){ reset(); document.body.dataset.tone="jungle"; render(); }
  else if (act === "choose") choose(parseInt(b.dataset.i, 10));
  else if (act === "proceed") proceed();
  else if (act === "event") closeEvent();
  else if (act === "day") closeDay();
});

document.body.dataset.tone = "jungle";
render();
</script>
</body>
</html>
