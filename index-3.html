<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1D18">
<title>개복치 무인도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1D18; --canopy:#162C24; --raise:#1D3A2F; --moss:#33544380;
  --bone:#E9E3D3; --dim:#9BAA9E; --amber:#E0A458; --aqua:#74A8A4;
  --blood:#A63D33; --leaf:#8FA86A; --violet:#9B8AB4;
}

body[data-tone="desert"]{
  --ink:#171009; --canopy:#241A11; --raise:#312317; --moss:#4A382480;
  --bone:#EFE6D2; --dim:#B0A088; --amber:#E9B45C; --aqua:#9DBFB4;
  --blood:#B04A2E; --leaf:#C9A94E; --violet:#B79BC0;
  background:radial-gradient(120% 60% at 50% 0%, #2A1D12 0%, transparent 60%), var(--ink);
}
body[data-tone="sea"]{
  --ink:#08171F; --canopy:#0F2733; --raise:#173743; --moss:#2A4E5B80;
  --bone:#E4EDEF; --dim:#8FA8B0; --amber:#E3A85C; --aqua:#6FC7C2;
  --blood:#B04E4A; --leaf:#7FBFA8; --violet:#9AA6D0;
  background:radial-gradient(120% 60% at 50% 0%, #103240 0%, transparent 60%), var(--ink);
}
body[data-tone="cold"]{
  --ink:#0D1319; --canopy:#161F27; --raise:#202C36; --moss:#33454F80;
  --bone:#E8EEF3; --dim:#93A5B2; --amber:#D9B87A; --aqua:#8FC2DA;
  --blood:#A85A55; --leaf:#9FBFC9; --violet:#AFA3C8;
  background:radial-gradient(120% 60% at 50% 0%, #1B2833 0%, transparent 60%), var(--ink);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:radial-gradient(120% 60% at 50% 0%, #1A3329 0%, transparent 60%), var(--ink);
  background-attachment:fixed;
  color:var(--bone); font-family:'Gowun Batang',serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
#app{max-width:520px; margin:0 auto; padding:20px 18px calc(44px + env(safe-area-inset-bottom))}

.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.22em; color:var(--dim); margin:0 0 14px}

/* 타이틀 */
.title h1{font-family:'Song Myung',serif; font-size:56px; line-height:.98; margin:0 0 18px; letter-spacing:-.02em}
.title h1 span{color:var(--amber)}
.tag{font-size:14px; line-height:1.85; color:var(--dim); margin:0 0 30px}
.terrains{display:flex; flex-direction:column; gap:9px; margin-bottom:28px}
.terrain{display:grid; grid-template-columns:60px 1fr auto; align-items:center; gap:10px;
  width:100%; text-align:left; padding:15px 14px; border-radius:2px;
  background:var(--canopy); border-left:2px solid var(--moss)}
.terrain{border-left-color:var(--moss)}
.terrain:hover{background:var(--raise)}
.terrain.t-jungle{border-left-color:#8FA86A}
.terrain.t-desert{border-left-color:#E9B45C}
.terrain.t-sea{border-left-color:#6FC7C2}
.terrain.t-cold{border-left-color:#9BC4D9}
.tname{font-family:'Song Myung',serif; font-size:19px}
.tdesc{font-size:12px; color:var(--dim); line-height:1.5}
.tgo{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--amber); white-space:nowrap}
.terrain:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.rules{font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:2.1;
  color:var(--dim); border-top:1px solid var(--moss); padding-top:16px; margin:0}

/* HUD */
.hud{margin-bottom:26px}
.strip{display:flex; gap:6px; margin-bottom:12px}
.strip-day{display:flex; gap:2px; flex:1}
.tick{flex:1; height:5px; background:#24382F; border-radius:1px; transition:background .25s}
.tick.past{background:var(--leaf)}
.tick.now{background:var(--amber); box-shadow:0 0 8px #E0A45899}
.hud-row{display:flex; justify-content:space-between; align-items:baseline;
  font-family:'IBM Plex Mono',monospace; font-size:11px; margin-bottom:14px}
.daynow{letter-spacing:.08em}
.left{color:var(--dim)}
.meters{display:flex; flex-direction:column; gap:7px; background:var(--canopy); padding:13px 14px; border-radius:2px}
.meter{display:grid; grid-template-columns:34px 1fr 16px; align-items:center; gap:10px}
.meter-label{font-size:12px; color:var(--dim)}
.meter-num{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); text-align:right}
.pips{display:flex; gap:4px}
.pip{flex:1; height:7px; border-radius:1px; background:#22362D; transition:background .3s}
.pip.on.e{background:var(--blood)}
.pip.on.f{background:var(--amber)}
.pip.on.w{background:var(--aqua)}
.pip.on.m{background:var(--violet)}

/* 상황 */
.scene{animation:rise .4s ease both}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.scode{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.2em; color:var(--amber); margin:0 0 8px}
.scene h2{font-family:'Song Myung',serif; font-size:29px; line-height:1.25; margin:0 0 14px}
.sbody{font-size:15px; line-height:1.95; color:#CFD6CC; margin:0 0 24px}
.choices{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px}
.choice{display:grid; grid-template-columns:24px 1fr; gap:10px; width:100%; text-align:left;
  padding:15px 14px; background:var(--canopy); border-radius:2px;
  border-left:2px solid transparent; transition:background .18s, border-color .18s, opacity .25s}
.choice:hover:not(:disabled){background:var(--raise); border-left-color:var(--amber)}
.choice:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.cnum{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--dim); padding-top:3px}
.ctext{font-size:14.5px; line-height:1.7}
.choice.dim{opacity:.26}
.choice.hit{border-left-color:var(--leaf); background:var(--raise)}
.choice.miss{border-left-color:var(--blood); background:var(--raise)}

/* 시트 */
.sheet{position:fixed; inset:0; background:#050C0AD9; display:flex; align-items:flex-end;
  justify-content:center; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:20; animation:fade .2s ease both}
@keyframes fade{from{opacity:0} to{opacity:1}}
.panel{width:100%; max-width:490px; background:var(--canopy); border-radius:3px;
  padding:24px 20px 20px; border-top:3px solid var(--moss); max-height:86vh; overflow-y:auto;
  animation:slide .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes slide{from{transform:translateY(24px); opacity:0} to{transform:none; opacity:1}}
.panel.good{border-top-color:var(--leaf)}
.panel.bad{border-top-color:var(--blood)}
.panel.day{border-top-color:var(--amber)}
.verdict{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.22em; margin:0 0 12px; color:var(--dim)}
.panel.good .verdict{color:var(--leaf)}
.panel.bad .verdict{color:var(--blood)}
.panel.day .verdict{color:var(--amber)}
.etitle{font-family:'Song Myung',serif; font-size:22px; margin:0 0 10px}
.pnote{font-size:14.5px; line-height:1.95; margin:0 0 8px; color:#D6DCD4}
.pdelta{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--amber); margin:14px 0 20px}
.daymeters{display:flex; flex-direction:column; gap:7px; margin:16px 0 20px}
.cta{width:100%; padding:15px; background:var(--bone); color:#0E1D18; font-size:15px; border-radius:2px; letter-spacing:.05em}
.cta:hover{background:#fff}
.cta:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

/* 엔딩 */
.end{padding-top:56px; animation:rise .5s ease both}
.end h1{font-family:'Song Myung',serif; font-size:52px; margin:0 0 20px; letter-spacing:-.02em}
.end.dead h1{color:var(--blood)}
.end.win h1{color:var(--amber)}
.stat{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--dim);
  border-top:1px solid var(--moss); padding-top:16px; margin:0 0 26px}
.cta.wide{margin-bottom:10px}
.ghost{width:100%; padding:13px; font-size:13px; color:var(--dim); border:1px solid var(--moss); border-radius:2px}
.ghost:hover{color:var(--bone)}
.ver{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--dim); opacity:.6; margin:18px 0 0}

@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const MAX = 5;
const ACTIONS_PER_DAY = 3;
const TOTAL_DAYS = 10;
const TOTAL_ACTIONS = ACTIONS_PER_DAY * TOTAL_DAYS;
const SLOT = ["아침", "점심", "저녁"];
const DRAW_HOME = 21;
const DRAW_AWAY_EACH = 3;

/* ── 정글 상황 50 ─────────────────────────────── */
const JUNGLE = [
{ id:"J01", kind:"자원", title:"야자나무 아래",
  body:"바람에 야자 열매 몇 개가 떨어져 있다. 딸이 배고프다고 한다. 어제부터 물은 거의 못 마셨다.",
  choices:[
    { t:"덜 익은 초록 열매에 구멍을 뚫고 안의 액체를 마신다", ok:true, d:{water:1}, note:"덜 익은 야자의 속물은 거의 무균에 가깝고 전해질까지 들어 있다." },
    { t:"갈색 열매를 쪼개 흰 과육을 조금씩 나눠 먹는다", ok:true, d:{food:1}, note:"양을 조절한 게 핵심이었다. 열량 높은 과육을 탈 없이 나눠 먹었다." },
    { t:"갈색 열매 과육을 배불리 먹는다", ok:false, d:{water:-1}, note:"코코넛 과육은 지방 함량이 매우 높다. 굶주린 위장에 한꺼번에 넣으면 설사가 시작되고, 정글에서 설사는 탈수로 직행한다." },
    { t:"열매를 여러 개 쪼개 그늘에 보관해두고 나눠 먹는다", ok:false, d:{food:-1}, note:"정글의 습도와 기온에서 쪼갠 과육은 하루도 못 간다. 다음 끼니를 위해 남겨둔 게 아니라 버린 셈이 됐다." },
    { t:"나무에 올라가 아직 매달린 신선한 열매를 딴다", ok:false, d:{energy:-1}, note:"야자나무는 15미터가 넘고 줄기에 잡을 곳이 없다. 열대 지역 부상 통계에서 야자나무 낙상은 상위권이다." }]},

{ id:"J02", kind:"자원", title:"덩굴에서 나는 물",
  body:"시냇물을 못 찾은 채 반나절이 지났다. 굵은 덩굴들이 나무를 타고 올라가 있다. 시험 삼아 하나를 자르자 액체가 흘러나온다.",
  choices:[
    { t:"맑고 묽은 액체가 나오는 덩굴을 골라 받아 마신다", ok:true, d:{water:1}, note:"무색·무취·묽은 수액은 물덩굴의 신호다." },
    { t:"굵은 대나무 마디를 흔들어보고, 물소리가 나는 마디를 쪼갠다", ok:true, d:{water:1}, note:"대나무 마디 안에 고인 물은 밀폐된 채 저장돼 있다." },
    { t:"우윳빛으로 걸쭉하게 흐르는 덩굴을 고른다 — 영양분이 있어 보인다", ok:false, d:{energy:-1}, note:"유백색 수액은 식물계에서 가장 신뢰할 만한 독성 신호다. 걸쭉하고 흰 액체가 나오는 순간 그 식물은 후보에서 지웠어야 했다." },
    { t:"여러 덩굴의 액체를 한데 모아 끓여서 마신다", ok:false, d:{water:-1}, note:"끓이면 세균은 죽지만 식물 독소는 그대로다. 안전한 액체까지 독이 섞여 통째로 못 쓰게 됐다." },
    { t:"덩굴 액체는 위험하니 시냇물을 계속 찾아 이동한다", ok:false, d:{water:-1}, note:"물을 아끼며 버티는 건 전략이 아니다. 탈수는 체력보다 판단력을 먼저 무너뜨린다." }]},

{ id:"J03", kind:"위기", title:"야영지를 정할 시간",
  body:"해가 기운다. 오늘 밤 잘 곳을 정해야 한다. 정글의 밤은 모기가 문제다.",
  choices:[
    { t:"바람이 통하는 능선 쪽 높은 지대에 자리를 잡는다", ok:true, d:{energy:1}, note:"바람은 모기를 흩고 습기를 말린다." },
    { t:"젖은 나뭇잎을 얹어 연기 나는 불을 피우고 그 바람 아래쪽에 눕는다", ok:true, d:{energy:1}, note:"연기는 정글에서 가장 값싼 방충망이다." },
    { t:"물을 뜨기 편하도록 웅덩이 바로 옆 평지에 자리를 잡는다", ok:false, d:{energy:-1}, note:"고인 물은 모기 유충의 번식지다. 밤새 물어뜯긴 데다 저지대는 새벽 냉기까지 고인다." },
    { t:"나뭇잎을 두껍게 쌓아 몸 전체를 덮고 잔다", ok:false, d:{energy:-1}, note:"정글의 낙엽 더미는 진드기·거머리·뱀의 서식지다. 게다가 젖은 잎은 체온을 빼앗는다." },
    { t:"큰 나무 아래 뿌리 사이 움푹한 곳에 자리를 잡는다", ok:false, d:{energy:-1}, note:"열대우림 사망 사고의 상당수가 죽은 가지 낙하다. 큰 나무 바로 아래는 정글에서 가장 피해야 할 잠자리다." }]},

{ id:"J04", kind:"위기", title:"수풀 속의 소리",
  body:"낮은 그르렁 소리가 20미터쯤 앞 수풀에서 난다. 아직 모습은 보이지 않는다. 딸이 얼어붙는다.",
  choices:[
    { t:"소리 반대 방향으로, 등을 보이지 않은 채 천천히 물러난다", ok:true, d:{energy:1}, note:"시선을 유지한 채 물러나는 건 포식자에게 먹잇감이 아니라는 신호다." },
    { t:"딸을 안아 올려 아빠와 하나의 큰 실루엣을 만들며 물러난다", ok:true, d:{energy:1}, note:"작은 개체는 표적이 되기 쉽다. 하나의 큰 형체가 되자 수풀 쪽이 조용해졌다." },
    { t:"근처 나무를 타고 최대한 높이 올라간다", ok:false, d:{energy:-1}, note:"정글의 대형 고양이과는 나무를 사람보다 훨씬 잘 탄다. 도망친 게 아니라 막다른 곳으로 올라간 것이다." },
    { t:"그 자리에 엎드려 죽은 척한다", ok:false, d:{energy:-1}, note:"죽은 척은 특정 곰에게만 제한적으로 통하는 방법이다. 고양이과 포식자에게 엎드린 자세는 먹잇감 신호다." },
    { t:"딸을 안고 전력으로 달려 거리를 벌린다", ok:false, d:{energy:-1}, note:"등을 보이고 달리는 순간 추격 본능이 켜진다. 뛰어서 이길 수 있는 상대가 아니었다." }]},

{ id:"J05", kind:"위기", title:"딸의 무릎",
  body:"딸이 나뭇가지에 무릎을 길게 긁혔다. 피는 곧 멎었지만 흙이 묻어 있다. 정글에서 상처는 사소하지 않다.",
  choices:[
    { t:"끓여 식힌 물로 흙을 씻어내고, 덮지 않은 채 자주 확인한다", ok:true, d:{energy:1}, note:"이물질 제거가 소독보다 먼저다." },
    { t:"상처를 씻은 뒤 깨끗한 천으로 느슨하게 덮고 매일 갈아준다", ok:true, d:{energy:1}, note:"느슨하게와 매일이 핵심이었다. 통기와 관찰을 둘 다 살렸다." },
    { t:"진흙을 발라 지혈하고 세균을 막는다", ok:false, d:{energy:-1}, note:"진흙 속 파상풍균은 산소가 없는 환경에서 번식한다. 상처를 막은 게 아니라 배양기를 만들어준 것이다." },
    { t:"상처가 마르도록 그냥 두고 신경 쓰지 않는다", ok:false, d:{energy:-1}, note:"열대 환경에서 방치된 찰과상은 며칠이면 화농으로 번진다. 무인도에서 감염은 맹수보다 흔한 사인이다." },
    { t:"나뭇잎으로 꽁꽁 싸매 흙과 벌레가 들어가지 않게 완전히 밀봉한다", ok:false, d:{energy:-1}, note:"밀봉은 습기와 열을 가둔다. 정글에서 완전히 덮인 상처는 가장 빠르게 곪는다." }]},

{ id:"J06", kind:"자원", title:"강가의 물고기",
  body:"얕은 강가에 손바닥만 한 물고기들이 몰려 있다. 돌로 웅덩이를 막으니 몇 마리가 갇힌다.",
  choices:[
    { t:"내장을 제거하고 살을 완전히 익혀 먹는다", ok:true, d:{food:1}, note:"민물고기는 완전히 익히는 게 유일한 안전선이다." },
    { t:"남은 살을 얇게 저며 연기 위에 매달아 훈연한다", ok:true, d:{food:1}, note:"훈연은 냉장이 없는 곳에서 쓸 수 있는 보존법이다." },
    { t:"신선하니 회로 먹는다 — 익히면 영양소가 파괴된다", ok:false, d:{food:-1}, note:"민물고기는 기생충의 중간 숙주다. 신선도와 기생충은 아무 상관이 없다." },
    { t:"화려한 색의 물고기가 크고 살이 많으니 그걸 우선 잡는다", ok:false, d:{food:-1}, note:"수생 생물에서 선명한 체색은 대개 경고색이다. 크기를 기준으로 고른 게 실수였다." },
    { t:"잡은 물고기를 물가 그늘에 담가두고 필요할 때 꺼내 먹는다", ok:false, d:{food:-1}, note:"열대의 강물은 미지근하다. 냉장이 아니라 부패 촉진 조건이었다." }]},

{ id:"J07", kind:"자원", title:"버섯과 열매",
  body:"비 온 다음 날, 쓰러진 나무에 탐스러운 버섯이 돋아 있다. 근처엔 처음 보는 붉은 열매도 달려 있다.",
  choices:[
    { t:"버섯은 건드리지 않고, 열매를 소량 입에 대본 뒤 몇 시간 기다린다", ok:true, d:{food:1}, note:"버섯을 통째로 배제한 판단이 옳았다." },
    { t:"흰개미집을 찾아 흰개미를 채집해 구워 먹는다", ok:true, d:{food:1}, note:"곤충은 정글에서 가장 안정적인 단백질원이다." },
    { t:"벌레가 파먹은 흔적이 있는 버섯을 고른다 — 벌레가 먹으면 안전하다", ok:false, d:{food:-1}, note:"곤충의 소화계는 사람과 완전히 다르다. 벌레가 멀쩡히 먹는 독버섯은 흔하다." },
    { t:"버섯을 오래 끓여 독을 날린 뒤 먹는다", ok:false, d:{food:-1}, note:"아마톡신 계열 독소는 끓여도 분해되지 않는다. 가열은 버섯에 한해 안전장치가 아니다." },
    { t:"새들이 쪼아 먹은 붉은 열매를 골라 배불리 먹는다", ok:false, d:{food:-1}, note:"새는 사람에게 치명적인 열매를 아무렇지 않게 먹는다. 조류의 식성은 인간 안전성의 근거가 못 된다." }]},

{ id:"J08", kind:"자원", title:"불씨",
  body:"사흘째 불을 못 피웠다. 비가 그친 직후라 사방이 젖어 있다.",
  choices:[
    { t:"나무에 매달린 채 죽어 있는 마른 잔가지를 모은다", ok:true, d:{food:1}, note:"땅에 닿지 않은 죽은 가지는 비 온 뒤에도 속이 말라 있다." },
    { t:"죽은 나무의 속을 쪼개 안쪽 마른 심재를 꺼내 쓴다", ok:true, d:{food:1}, note:"겉이 젖어도 심재는 마른 채다." },
    { t:"땅에 떨어진 나뭇가지를 모아 햇볕에 말린다", ok:false, d:{food:-1}, note:"땅에 닿은 나무는 아래에서부터 물을 빨아들이고 이미 썩기 시작한다. 반나절 볕으로는 마르지 않는다." },
    { t:"굵은 통나무를 먼저 쌓고 그 위에 불을 붙인다", ok:false, d:{food:-1}, note:"불은 아래에서 위로 올라간다. 불쏘시개 없이 굵은 나무부터 쌓으면 불씨는 살아나지 못한다." },
    { t:"푸른 잎을 많이 넣어 연기를 크게 내며 불을 키운다", ok:false, d:{energy:-1}, note:"생잎의 수분이 불꽃을 죽인다. 연기는 불이 잡힌 다음에 내는 것이지 불을 키우는 방법이 아니다." }]},

{ id:"J09", kind:"자원", title:"소금",
  body:"정글 생활 일주일째. 둘 다 이상하게 기운이 없고 다리에 쥐가 난다. 물은 충분히 마시고 있는데도 그렇다.",
  choices:[
    { t:"해안 쪽으로 내려가 바닷물을 졸여 소금을 얻는다", ok:true, d:{food:1}, note:"증발시켜 얻은 소금은 안전하다. 경련이 하루 만에 잦아들었다." },
    { t:"잡은 동물의 피와 내장을 버리지 않고 함께 먹는다", ok:true, d:{food:1}, note:"혈액과 내장은 나트륨 저장고다. 버리던 부위가 약이 됐다." },
    { t:"물을 더 많이 마셔 쥐를 가라앉힌다", ok:false, d:{energy:-1}, note:"전해질이 빠진 상태에서 물만 늘리면 나트륨 농도가 더 희석된다. 증상의 원인을 더 밀어붙인 셈이다." },
    { t:"바닷물을 조금씩 마셔 소금을 보충한다", ok:false, d:{water:-1}, note:"바닷물의 염분 농도는 신장이 처리할 수 있는 한계를 넘는다. 배출하는 데 마신 것보다 많은 수분이 든다." },
    { t:"식물을 더 많이 먹어 미네랄을 채운다", ok:false, d:{food:-1}, note:"열대 식물에는 칼륨이 많고 나트륨은 거의 없다. 칼륨만 더 늘리면 균형은 오히려 나빠진다." }]},

{ id:"J10", kind:"위기", title:"밤사이 불어난 물",
  body:"한밤중 굵은 빗소리에 잠이 깬다. 야영지 옆 마른 도랑이었던 곳으로 물이 차오르기 시작한다.",
  choices:[
    { t:"짐을 포기하더라도 즉시 고지대로 이동한다", ok:true, d:{energy:1}, note:"짐은 다시 구할 수 있다. 30분 뒤 야영지 자리는 완전히 잠겼다." },
    { t:"딸을 먼저 높은 바위로 올려 보낸 뒤 아빠가 뒤따른다", ok:true, d:{energy:1}, note:"약한 쪽을 먼저 올리는 순서가 맞았다." },
    { t:"돌과 흙으로 둑을 쌓아 물길을 돌린다", ok:false, d:{energy:-1}, note:"상류에서 내려오는 유량은 사람이 밤중에 쌓는 둑으로 감당할 수 있는 양이 아니다. 대피할 시간을 쌓는 데 써버렸다." },
    { t:"야영지에서 가장 높은 구석으로 옮겨 비가 그치길 기다린다", ok:false, d:{energy:-1}, note:"계곡 지형의 수위는 몇 분 만에 사람 키를 넘는다. 같은 지형 안에서 조금 올라가는 건 이동이 아니다." },
    { t:"어둠 속 산은 위험하니 탁 트인 해안 평지로 내려간다", ok:false, d:{energy:-1}, note:"해안 평지는 더 낮은 데다 만조와 겹친다. 물을 피해 물이 모이는 쪽으로 내려간 것이다." }]},

{ id:"J11", kind:"준비", title:"밤을 넘기는 불",
  body:"겨우 불을 피웠다. 이제 자야 하는데, 아침에 처음부터 다시 피울 자신은 없다.",
  choices:[
    { t:"굵은 장작 하나를 재 속에 반쯤 묻어 잔불을 재운다", ok:true, d:{food:1}, note:"재는 최고의 단열재다. 아침에 후 불자 붉은 속이 살아났다." },
    { t:"통나무 두 개를 나란히 붙이고 그 사이에 잔불을 넣어 천천히 타게 한다", ok:true, d:{food:1}, note:"공기를 좁게 주면 불은 느리게 오래 간다." },
    { t:"나무를 잔뜩 쌓아 불을 크게 키워두고 잔다 — 커야 오래 간다", ok:false, d:{food:-1}, note:"큰 불은 오래 가는 게 아니라 빨리 먹는다. 새벽 두 시에 연료를 다 쓰고 꺼졌다. 불은 키우는 게 아니라 재우는 것이다." },
    { t:"젖은 나무를 얹어 천천히 타게 한다", ok:false, d:{food:-1}, note:"젖은 나무는 천천히 타는 게 아니라 불꽃을 꺼뜨린다. 남은 잔불까지 식혔다." },
    { t:"불을 완전히 끄고 아침에 다시 피우기로 한다", ok:false, d:{energy:-1}, note:"불씨를 살려두는 비용보다 다시 피우는 비용이 훨씬 크다. 정글에서 불은 도구가 아니라 자산이다." }]},

{ id:"J12", kind:"준비", title:"물을 담을 것",
  body:"물가까지 왕복하는 데 반나절이 든다. 물을 담아 올 무언가가 필요하다.",
  choices:[
    { t:"굵은 대나무를 마디째 잘라 통을 만든다", ok:true, d:{water:1}, note:"마디가 바닥이 되고 속은 이미 비어 있다. 자연이 만들어둔 물통이다." },
    { t:"야자 껍질을 파내 그릇을 만들고 불에 그을려 표면을 굳힌다", ok:true, d:{water:1}, note:"그을린 면은 물을 덜 먹는다." },
    { t:"태양광 증류기를 만들어 물을 모은다", ok:false, d:{energy:-1}, note:"구덩이와 비닐로 만드는 증류기는 매뉴얼의 단골이지만 실측 산출량은 하루 한 컵에도 못 미치는 경우가 많다. 그 노동으로 물을 길어 오는 편이 훨씬 낫다." },
    { t:"큰 잎으로 물을 싸서 끈으로 묶어 나른다", ok:false, d:{water:-1}, note:"잎은 용기가 아니다. 돌아오는 길에 절반이 샜다." },
    { t:"땅을 파고 물을 부어 저수조를 만든다", ok:false, d:{water:-1}, note:"흙은 물을 빨아들이고 흙 속의 것을 물에 내준다. 저장이 아니라 오염이었다." }]},

{ id:"J13", kind:"준비", title:"신호를 남기는 법",
  body:"멀리서 비행기 소리가 두 번쯤 들렸다. 다음번을 대비해야 한다.",
  choices:[
    { t:"해변 모래에 최대한 큰 글자 하나를 파고, 가장자리에 돌을 쌓아 그림자를 만든다", ok:true, d:{energy:1}, note:"상공에서 보이는 건 색이 아니라 그림자다." },
    { t:"불 세 개를 삼각형으로 미리 쌓아두고 언제든 붙일 수 있게 준비한다", ok:true, d:{energy:1}, note:"셋은 국제적으로 통용되는 조난 신호다." },
    { t:"가장 높은 나무 꼭대기에 밝은 천을 매단다", ok:false, d:{energy:-1}, note:"상공에서는 나뭇잎 지붕만 보인다. 수관에 가려 아무 효과도 없는 데다, 그 높이를 오르는 게 이 섬에서 가장 위험한 행동이었다." },
    { t:"표시를 여러 개 작게 나눠 여러 곳에 만든다", ok:false, d:{energy:-1}, note:"상공 수색에서 작은 표시는 없는 것과 같다. 하나를 크게 만드는 게 원칙이다." },
    { t:"불은 밤에 잘 보이니 밤에만 피우기로 한다", ok:false, d:{food:-1}, note:"수색은 압도적으로 낮에 이뤄진다. 밤에만 태운 연료가 정작 필요한 시간에 없었다." }]},

{ id:"J14", kind:"심리", title:"딸이 울음을 터뜨린다",
  body:"사흘째 밤, 딸이 갑자기 울음을 터뜨린다. 엄마를 찾고, 집에 가고 싶다고 한다.",
  choices:[
    { t:"울음을 막지 않고 옆에 앉아 있는다. 다 울고 나면 내일 할 일을 함께 정한다", ok:true, d:{morale:1}, note:"감정을 다 흘려보낸 뒤에야 다음 이야기가 들어간다." },
    { t:"내일부터 물 뜨는 일을 딸에게 맡기겠다고 말한다", ok:true, d:{morale:1}, note:"역할은 아이에게 가장 강한 진통제다." },
    { t:"내일이면 배가 올 거라고 안심시킨다", ok:false, d:{morale:-1}, note:"날짜를 약속하면 그날 무너진다. 장기 조난에서 가장 먼저 꺾이는 사람은 비관론자가 아니라 근거 없는 낙관론자다." },
    { t:"울면 체력이 소모되니 그치라고 단호하게 말한다", ok:false, d:{morale:-1}, note:"감정을 막으면 사라지는 게 아니라 안으로 들어간다. 다음 날 딸은 아무 말도 하지 않았다." },
    { t:"진정될 때까지 혼자 두고 자리를 비켜준다", ok:false, d:{morale:-1}, note:"어른에게는 공간이 필요하지만 아이에게는 존재가 필요하다. 혼자 남겨진 시간이 공포를 키웠다." }]},

{ id:"J15", kind:"심리", title:"아빠가 무너질 것 같다",
  body:"닷새째. 아빠 스스로가 한계에 왔다. 이걸 딸에게 어떻게 할 것인가.",
  choices:[
    { t:"힘든 건 인정하되, 오늘 할 일 세 가지를 딸 앞에서 소리 내어 정한다", ok:true, d:{morale:1}, note:"불안은 숨길 때가 아니라 형태를 가질 때 작아진다." },
    { t:"매일 같은 시간에 같은 일을 하는 일과를 만든다", ok:true, d:{morale:1}, note:"반복되는 하루는 그 자체로 구조물이다." },
    { t:"딸 앞에서는 절대 약한 모습을 보이지 않기로 한다", ok:false, d:{morale:-1}, note:"아이는 표정보다 공기를 읽는다. 숨긴 불안은 설명 없는 불안이 되어 더 무겁게 전해진다." },
    { t:"앞으로의 걱정을 전부 딸에게 털어놓고 함께 고민한다", ok:false, d:{morale:-1}, note:"솔직함과 떠넘김은 다르다. 감당할 수 없는 무게를 받은 아이는 그날 밤 잠들지 못했다." },
    { t:"쉬는 시간을 줄여서라도 할 일을 더 해둔다", ok:false, d:{morale:-1}, note:"한계에 온 몸에서 회복을 빼면 남는 건 실수뿐이다." }]},

{ id:"J16", kind:"심리", title:"딸이 고집을 부린다",
  body:"딸이 바다 건너편에 사람이 있는 것 같다며 뗏목을 만들어 가자고 조른다. 말려도 듣지 않는다.",
  choices:[
    { t:"안 되는 이유를 설명하고, 대신 딸이 원하는 다른 한 가지를 하게 해준다", ok:true, d:{morale:1}, note:"거절에는 대안이 붙어야 거절로 끝나지 않는다." },
    { t:"함께 해변까지 가서 조류가 어느 쪽으로 흐르는지 직접 보여준다", ok:true, d:{morale:1}, note:"본 것은 들은 것보다 오래 간다." },
    { t:"위험하니 무조건 안 된다고 못 박는다", ok:false, d:{morale:-1}, note:"이유 없는 금지는 설득이 아니라 도전 과제가 된다. 며칠 뒤 딸이 혼자 해변으로 내려갔다." },
    { t:"사기를 위해서라도 뗏목 만들기를 함께 시작한다", ok:false, d:{food:-1}, note:"도구도 재료도 없는 상태에서 뗏목은 며칠치 체력을 삼킨다. 실패했을 때의 좌절은 처음보다 크다." },
    { t:"스스로 포기할 때까지 내버려 둔다", ok:false, d:{morale:-1}, note:"방치는 존중이 아니다. 혼자 애쓰다 지친 딸은 아빠에게 말하는 것을 그만뒀다." }]},

{ id:"J17", kind:"함정", title:"표류해 온 상자",
  body:"해변에 나무 상자가 떠밀려 왔다. 통조림 몇 개와 빈 플라스틱 병이 들어 있다.",
  choices:[
    { t:"멀쩡한 통조림만 골라 열고 냄새를 확인한 뒤 먹는다", ok:true, d:{food:1}, note:"고른다는 판단 자체가 정답이었다." },
    { t:"빈 플라스틱 병을 물 담는 용기로 쓴다", ok:true, d:{water:1}, note:"이 섬에서 가장 귀한 건 물이 아니라 물을 담을 것이었다." },
    { t:"뚜껑이 볼록하게 부푼 것부터 먹는다 — 가스가 찼다는 건 잘 발효됐다는 뜻이다", ok:false, d:{food:-1}, note:"부푼 통조림은 보툴리누스균이 이미 활동했다는 신호다. 이 독소는 극소량으로 치명적이고 맛도 냄새도 나지 않는다. 부푼 것은 열지도 말았어야 했다." },
    { t:"통조림 국물은 짜니 버리고 건더기만 먹는다", ok:false, d:{water:-1}, note:"그 국물이 이 섬에서 구하기 가장 어려운 것, 수분과 염분이었다." },
    { t:"녹슨 통조림도 안은 멀쩡하니 전부 챙긴다", ok:false, d:{food:-1}, note:"녹이 관통한 자리에는 미세한 구멍이 생긴다. 내용물은 이미 바깥과 통해 있었다." }]},

{ id:"J18", kind:"함정", title:"쓰러진 사슴",
  body:"숲 한가운데 작은 사슴이 죽어 있다. 아직 굳지 않았고 겉에 상처는 보이지 않는다. 며칠 만의 고기다.",
  choices:[
    { t:"손대지 않고 지나친다. 대신 이 사슴이 다니던 길목을 살펴 덫 자리를 정한다", ok:true, d:{energy:1}, note:"참는 것도 기술이다. 대신 다음 끼니의 자리를 얻었다." },
    { t:"직접 덫을 놓아 작은 동물을 잡기로 한다", ok:true, d:{food:1}, note:"사인을 아는 고기만 먹는다는 원칙을 지켰다." },
    { t:"상처가 없으니 병으로 죽은 게 아닐 것이다. 충분히 익혀 먹는다", ok:false, d:{food:-1}, note:"상처가 없다는 건 병으로 죽었을 가능성이 오히려 높다는 뜻이다. 사인을 모르는 사체는 가열로 해결되지 않는 것들을 품고 있다." },
    { t:"내장만 피하고 살코기만 발라 먹는다", ok:false, d:{food:-1}, note:"병원체는 부위를 가리지 않는다. 내장을 피한다고 안전해지는 건 신선한 사냥감일 때 이야기다." },
    { t:"고기를 훈연해 보존해두고 나중에 먹는다", ok:false, d:{food:-1}, note:"처음부터 위험한 고기를 오래 보관한 것뿐이다. 훈연은 안전한 고기의 수명을 늘리는 기술이지 소독법이 아니다." }]},

{ id:"J19", kind:"함정", title:"맑은 웅덩이",
  body:"바위에 둘러싸인 웅덩이가 있다. 물이 유리처럼 맑고 바닥의 조약돌까지 다 보인다. 벌레 한 마리 없다.",
  choices:[
    { t:"맑아 보여도 고인 물이니 끓여서 마신다", ok:true, d:{water:1}, note:"보이는 것과 안전은 무관하다는 원칙을 지켰다." },
    { t:"웅덩이로 흘러드는 물줄기를 찾아 그 위쪽에서 뜬다", ok:true, d:{water:1}, note:"고인 물보다 흐르는 물, 아래보다 위쪽이다." },
    { t:"벌레도 개구리도 없으니 오히려 깨끗한 물이다", ok:false, d:{water:-1}, note:"생물이 없다는 건 깨끗하다는 뜻이 아니라 살 수 없다는 뜻일 수 있다. 아무것도 못 사는 물을 사람이 마셨다." },
    { t:"이렇게 맑은데 굳이 끓일 필요가 없다", ok:false, d:{food:-1}, note:"투명도는 미생물과 아무 관계가 없다. 눈에 보이는 것은 애초에 문제가 아니었다." },
    { t:"물이 차가우니 세균이 적을 것이다", ok:false, d:{food:-1}, note:"저온은 번식을 늦출 뿐 죽이지 않는다. 차가움은 안전의 근거가 못 된다." }]},

{ id:"J20", kind:"몸", title:"설사",
  body:"딸이 새벽부터 설사를 시작했다. 하루에 여러 번, 기운이 눈에 띄게 빠진다.",
  choices:[
    { t:"끓여 식힌 물에 소금과 단것을 조금 타서 조금씩 자주 마시게 한다", ok:true, d:{water:1}, note:"소금과 당이 함께 있어야 물이 흡수된다. 경구수액의 원리다." },
    { t:"평소보다 더 자주, 더 많이 물을 마시게 한다", ok:true, d:{water:1}, note:"나가는 만큼 넣는 게 유일한 처방이었다." },
    { t:"물을 마시면 설사가 심해지니 당분간 물을 줄인다", ok:false, d:{energy:-1}, note:"설사로 죽는 원인은 설사가 아니라 탈수다. 물을 끊는 건 증상을 막는 게 아니라 유일한 방어선을 끊는 것이다." },
    { t:"굶기면 장이 쉬니 하루 종일 아무것도 먹이지 않는다", ok:false, d:{food:-1}, note:"굶기는 처방은 폐기된 지 오래다. 회복에 필요한 에너지까지 함께 끊었다." },
    { t:"숯을 갈아 먹여 독소를 흡수시킨다", ok:false, d:{food:-1}, note:"모닥불의 나무 숯은 의료용 활성탄과 다른 물질이다. 독소 대신 영양분을 붙잡아 갔다." }]},

{ id:"J21", kind:"몸", title:"발",
  body:"젖은 신발을 사흘째 벗지 못했다. 발바닥이 하얗게 불어 있고 걸을 때마다 쓰라리다.",
  choices:[
    { t:"밤마다 신발과 양말을 벗고 발을 완전히 말린 뒤 잔다", ok:true, d:{energy:1}, note:"발을 말리는 시간이 이 섬에서 가장 값진 시간이었다." },
    { t:"낮에도 한 번은 신발을 벗고 발을 볕에 말린다", ok:true, d:{energy:1}, note:"하루 한 번의 건조가 며칠 뒤의 걷기를 결정한다." },
    { t:"벌레와 상처가 무서우니 신발을 계속 신어 발을 보호한다", ok:false, d:{energy:-1}, note:"젖은 채 밀폐된 발은 열대에서 며칠이면 짓무른다. 보호한 게 아니라 배양한 것이다. 걷지 못하면 이 섬에서 할 수 있는 게 없다." },
    { t:"불에 가까이 대고 빠르게 말린다", ok:false, d:{energy:-1}, note:"불어터진 피부는 감각이 둔하다. 뜨거운 걸 느꼈을 때는 이미 화상이었다." },
    { t:"물집을 터뜨려 물을 빼고 계속 걷는다", ok:false, d:{energy:-1}, note:"물집의 껍질은 그 자체가 무균 붕대다. 터뜨리는 순간 열린 상처가 됐다." }]},

{ id:"J22", kind:"몸", title:"열",
  body:"아빠의 몸이 뜨겁다. 오한이 나고 머리가 지끈거린다. 딸이 걱정스러운 얼굴로 본다.",
  choices:[
    { t:"그늘에 눕고 물을 평소보다 많이 마시며 하루를 통째로 쉰다", ok:true, d:{energy:1}, note:"하루를 버린 게 아니라 며칠을 산 것이다." },
    { t:"젖은 천으로 목과 겨드랑이를 닦아 열을 내린다", ok:true, d:{energy:1}, note:"큰 혈관이 지나는 자리를 식히는 게 가장 효율적이다." },
    { t:"두껍게 덮고 땀을 내서 열을 뺀다", ok:false, d:{energy:-1}, note:"땀을 내면 열이 빠진다는 건 가장 오래된 오해다. 열을 가두면 체온은 더 오른다. 특히 열대의 밤에는 위험하다." },
    { t:"열은 몸이 싸우는 증거이니 평소대로 활동한다", ok:false, d:{energy:-1}, note:"싸우는 중이라는 건 다른 데 쓸 여력이 없다는 뜻이다. 그날의 노동이 회복을 며칠 밀어냈다." },
    { t:"찬물에 몸을 통째로 담가 빠르게 식힌다", ok:false, d:{energy:-1}, note:"급격한 냉각은 혈관을 수축시키고 오한을 부른다. 겉만 식고 속은 그대로였다." }]},

{ id:"J23", kind:"자원", title:"빗물",
  body:"비가 온다. 지붕 삼은 잎에서 물이 줄줄 흘러내린다.",
  choices:[
    { t:"처음 얼마간은 흘려보내고 그 다음부터 받는다", ok:true, d:{water:1}, note:"첫 물이 지붕을 씻어내고 나면 그다음이 깨끗하다." },
    { t:"지붕을 거치지 않게 천을 따로 펴서 하늘에서 바로 받는다", ok:true, d:{water:1}, note:"중간 경로를 없애는 게 가장 확실한 정수였다." },
    { t:"아까우니 첫 물부터 전부 받는다", ok:false, d:{water:-1}, note:"초기 빗물은 지붕과 잎에 쌓인 먼지·새똥·곤충을 씻어낸 물이다. 가장 더러운 물을 가장 먼저 담았다." },
    { t:"빗물은 하늘에서 온 것이니 끓이지 않고 오래 저장한다", ok:false, d:{food:-1}, note:"빗물 자체는 깨끗해도 받은 그릇과 열대의 온도가 문제다. 이틀 만에 물에서 냄새가 났다." },
    { t:"땅에 고인 빗물을 퍼 담는다", ok:false, d:{water:-1}, note:"땅에 닿는 순간 빗물은 그냥 흙탕물이다." }]},

{ id:"J24", kind:"자원", title:"조수 웅덩이",
  body:"썰물이다. 바위 웅덩이에 조개와 게가 갇혀 있다.",
  choices:[
    { t:"바위에 단단히 붙어 있는 조개만 떼어내 완전히 익혀 먹는다", ok:true, d:{food:1}, note:"붙어 있다는 건 살아 있다는 뜻이다." },
    { t:"게는 다리를 떼고 완전히 익혀 먹는다", ok:true, d:{food:1}, note:"완전히 익힌다는 원칙 하나로 대부분의 위험이 사라진다." },
    { t:"이미 입을 벌리고 있는 조개는 손질이 쉬우니 그것부터 담는다", ok:false, d:{food:-1}, note:"살아있는 조개는 건드리면 입을 닫는다. 벌린 채 반응이 없다는 건 죽었다는 뜻이고, 조개는 죽는 순간부터 급격히 상한다." },
    { t:"조개는 갓 잡았으니 날로 먹는다", ok:false, d:{food:-1}, note:"여과 섭식자인 조개는 주변 물의 모든 것을 몸에 모은다. 날것은 이 섬에서 가장 위험한 식사다." },
    { t:"맨발로 웅덩이에 들어가 발로 더듬어 잡는다 — 손보다 빠르다", ok:false, d:{energy:-1}, note:"조수 웅덩이 바닥에는 성게와 쏘는 물고기가 숨어 있다. 열대 해안 부상의 대부분이 맨발로 밟아서 생긴다." }]},

{ id:"J25", kind:"자원", title:"뿌리",
  body:"넓은 잎 아래에서 굵은 뿌리덩이를 캐냈다. 감자와 비슷하게 생겼다.",
  choices:[
    { t:"껍질을 벗기고 잘게 썰어 오래 삶는다. 삶은 물은 버린다", ok:true, d:{food:1}, note:"물에 녹여 버리는 게 유일한 해법이었다." },
    { t:"삶은 뒤 조금 먹어보고 입이 아리면 다시 더 삶는다", ok:true, d:{food:1}, note:"입안의 감각이 가장 정확한 계측기였다." },
    { t:"감자처럼 구워 먹는다", ok:false, d:{energy:-1}, note:"토란류의 옥살산칼슘 결정은 굽는 정도로는 거의 줄지 않는다. 입안과 목이 바늘로 찌르듯 부었다." },
    { t:"아린 맛이 나면 소금을 뿌려 중화시킨다", ok:false, d:{food:-1}, note:"아린 맛은 간의 문제가 아니라 물리적으로 점막을 찌르는 결정 때문이다. 소금은 아무것도 바꾸지 못한다." },
    { t:"껍질에 영양이 많으니 껍질째 먹는다", ok:false, d:{food:-1}, note:"자극 물질이 가장 많이 몰린 곳이 껍질과 껍질 바로 아래다." }]},

{ id:"J26", kind:"자원", title:"달팽이와 민물게",
  body:"비 온 뒤 커다란 달팽이가 기어 다닌다. 개울에는 민물게도 보인다.",
  choices:[
    { t:"하루쯤 굶겨 속을 비운 뒤 완전히 익혀 먹는다", ok:true, d:{food:1}, note:"기다림이 안전을 샀다." },
    { t:"민물게는 껍질째 오래 끓여 국물까지 먹는다", ok:true, d:{food:1}, note:"충분한 시간과 온도가 전부였다." },
    { t:"소금물에 담가 해감한 뒤 살짝 데쳐 먹는다", ok:false, d:{energy:-1}, note:"달팽이가 옮기는 기생충은 살짝 데치는 온도에서 죽지 않는다. 해감은 흙을 뺄 뿐 기생충과는 무관하다." },
    { t:"점액은 씻어내면 되니 맨손으로 편히 잡는다", ok:false, d:{energy:-1}, note:"점액 자체에 유충이 있다. 만진 손으로 다른 음식을 집는 순간 익힌 의미가 사라진다." },
    { t:"민물게는 오래 익히면 살이 줄어드니 겉만 익혀 먹는다", ok:false, d:{food:-1}, note:"민물게는 폐흡충의 중간 숙주다. 반쯤 익힌 게는 익히지 않은 것과 다르지 않다." }]},

{ id:"J27", kind:"자원", title:"야자순과 바나나",
  body:"태풍에 쓰러진 야자나무가 있다. 야생 바나나도 몇 그루 있는데 열매는 씨가 가득해 먹을 게 없다.",
  choices:[
    { t:"쓰러진 야자나무의 속심을 잘라 먹는다", ok:true, d:{food:1}, note:"어차피 죽은 나무다. 대가 없이 얻은 몇 안 되는 것이었다." },
    { t:"바나나 줄기를 잘라 안쪽 연한 속대를 삶아 먹는다", ok:true, d:{food:1}, note:"열매가 아니라 줄기가 식량인 식물이었다." },
    { t:"서 있는 야자나무를 베어 순을 얻는다", ok:false, d:{food:-1}, note:"순을 얻는 대가로 나무 한 그루가 죽는다. 그 나무가 몇 달간 낼 열매를 한 끼와 바꿨다." },
    { t:"씨가 많아도 익으면 먹을 수 있으니 기다린다", ok:false, d:{food:-1}, note:"야생 바나나는 씨가 열매의 대부분을 차지한다. 익어도 사정은 달라지지 않는다." },
    { t:"바나나 잎을 삶아 먹는다", ok:false, d:{food:-1}, note:"잎은 섬유질 덩어리다. 소화에 쓰는 에너지가 얻는 것보다 많다." }]},

{ id:"J28", kind:"자원", title:"새 둥지",
  body:"절벽 중턱에 바닷새 둥지가 여럿 보인다. 알이 들어 있다.",
  choices:[
    { t:"손이 닿는 낮은 둥지에서 알을 몇 개만 가져온다", ok:true, d:{food:1}, note:"조금만 가져간 덕에 다음에도 올 수 있었다." },
    { t:"알을 물에 넣어 가라앉는 것만 골라 익혀 먹는다", ok:true, d:{food:1}, note:"물 한 그릇이 가장 간단한 신선도 검사였다." },
    { t:"둥지 하나를 통째로 비워 한 번에 많이 챙긴다", ok:false, d:{food:-1}, note:"새는 알을 다 잃으면 그 자리를 버린다. 며칠 뒤 절벽은 비어 있었다." },
    { t:"물에 뜨는 알이 가벼우니 나르기 좋다", ok:false, d:{food:-1}, note:"뜨는 알은 속에 가스가 찬 것, 즉 이미 상한 것이다. 가벼운 이유가 그것이었다." },
    { t:"알은 껍질이 있으니 상하지 않는다. 며칠 두고 먹는다", ok:false, d:{food:-1}, note:"껍질에는 숨구멍이 있다. 열대의 기온에서 며칠이면 안이 먼저 변한다." }]},

{ id:"J29", kind:"위기", title:"뱀",
  body:"수풀을 헤치던 아빠의 종아리에 날카로운 통증이 온다. 무언가가 스르륵 지나간다.",
  choices:[
    { t:"물린 자리를 심장보다 낮게 두고, 최대한 움직이지 않고 눕는다", ok:true, d:{energy:1}, note:"움직이지 않는 것이 이 상황에서 가장 강력한 처치였다." },
    { t:"물린 다리를 부목으로 고정하고 뱀의 생김새를 기억해둔다", ok:true, d:{energy:1}, note:"고정은 독의 확산 속도를 늦춘다." },
    { t:"독이 퍼지지 않게 위쪽을 끈으로 단단히 묶는다", ok:false, d:{energy:-1}, note:"지혈대는 독을 한곳에 가두고, 그 자리의 조직이 먼저 죽는다. 팔다리를 잃는 원인 중 하나가 응급처치로 묶은 끈이다." },
    { t:"입으로 독을 빨아낸다", ok:false, d:{energy:-1}, note:"빨아낼 수 있는 독은 거의 없고, 입안의 상처로 독과 세균이 함께 들어간다. 영화가 만든 가장 위험한 오해다." },
    { t:"상처를 칼로 째서 피와 함께 독을 흘려보낸다", ok:false, d:{energy:-1}, note:"절개는 독을 빼지 못하고 감염 경로와 출혈만 만든다." }]},

{ id:"J30", kind:"위기", title:"멧돼지",
  body:"수풀에서 검고 육중한 멧돼지가 나온다. 뒤에 새끼 몇 마리가 따라온다.",
  choices:[
    { t:"가까운 나무 위로 올라간다", ok:true, d:{energy:1}, note:"멧돼지는 나무를 오르지 못한다. 이번에는 위가 정답이었다." },
    { t:"큰 바위나 쓰러진 나무를 사이에 두고 원을 그리며 물러난다", ok:true, d:{energy:1}, note:"돌진은 직선이다. 사이에 뭔가를 두는 것만으로 막을 수 있다." },
    { t:"몸을 크게 보이며 소리를 질러 쫓아낸다", ok:false, d:{energy:-1}, note:"고양이과에 통하는 방법이 멧돼지에는 통하지 않는다. 새끼를 데린 어미에게 정면 위협은 돌진 신호다." },
    { t:"등을 보이지 않고 시선을 맞춘 채 천천히 물러난다", ok:false, d:{energy:-1}, note:"시선 유지는 포식자용 대응이다. 멧돼지는 사냥하려는 게 아니라 밀어내려 한다. 그 속도를 걸어서 벗어날 수는 없었다." },
    { t:"엎드려 몸을 낮추고 지나가기를 기다린다", ok:false, d:{energy:-1}, note:"낮은 자세는 멧돼지의 눈높이로 들어가는 것이다. 위로 피해야 할 상황에서 아래로 갔다." }]},

{ id:"J31", kind:"위기", title:"길을 잃다",
  body:"짐승을 쫓다 정신을 차리니 어디가 어딘지 모르겠다. 딸은 야영지에 혼자 있다.",
  choices:[
    { t:"그 자리에 멈춰 표시를 남기고, 물소리를 찾아 개울을 따라 내려간다", ok:true, d:{energy:1}, note:"물길은 이 섬에서 유일하게 방향을 가진 것이었다." },
    { t:"왔던 방향으로 되짚으며 꺾인 가지 흔적을 따라간다", ok:true, d:{energy:1}, note:"자신이 남긴 흔적이 가장 믿을 만한 지도였다." },
    { t:"해가 지는 쪽이 서쪽이니 그 반대로 계속 걷는다", ok:false, d:{energy:-1}, note:"방위를 알아도 야영지가 어느 방위인지 모르면 소용이 없다. 확신을 갖고 더 멀어졌다." },
    { t:"높은 능선으로 올라가 야영지를 내려다본다", ok:false, d:{energy:-1}, note:"열대우림에서는 능선에 올라도 보이는 건 나무 지붕뿐이다. 체력만 소진했다." },
    { t:"어두워지기 전에 최대한 많이 움직여 본다", ok:false, d:{energy:-1}, note:"길을 잃었을 때 이동량은 구조 확률을 낮춘다. 움직일수록 찾아야 할 범위가 넓어진다." }]},

{ id:"J32", kind:"위기", title:"벌떼",
  body:"나무를 흔들자 매달려 있던 벌집이 떨어졌다. 벌떼가 일어난다.",
  choices:[
    { t:"팔로 얼굴을 감싸고 뒤돌아보지 않고 곧장 멀리 달린다", ok:true, d:{energy:1}, note:"벌은 오래 쫓지 않는다. 거리가 유일한 해법이었다." },
    { t:"딸을 앞세워 먼저 뛰게 하고 아빠가 뒤에서 따라간다", ok:true, d:{energy:1}, note:"뒤에 남는 쪽이 더 쏘인다는 걸 알고 자리를 정했다." },
    { t:"개울로 뛰어들어 물속에 숨는다", ok:false, d:{energy:-1}, note:"벌은 수면 위에서 기다린다. 숨을 쉬러 올라오는 순간이 가장 위험하다." },
    { t:"그 자리에 엎드려 움직이지 않는다", ok:false, d:{energy:-1}, note:"벌은 움직임보다 냄새와 이산화탄소에 반응한다. 가만히 있는 건 표적이 되는 것이다." },
    { t:"쏘인 자리의 침을 손가락으로 집어 뽑는다", ok:false, d:{energy:-1}, note:"손끝으로 집으면 독주머니를 짜 넣는 셈이 된다. 옆으로 긁어냈어야 했다." }]},

{ id:"J33", kind:"위기", title:"폭풍",
  body:"하늘이 검어지고 바람이 거세진다. 멀리서 번쩍임이 보인다.",
  choices:[
    { t:"큰 나무를 피해 낮은 덤불 지대에서 몸을 웅크린다", ok:true, d:{energy:1}, note:"주변에서 가장 높지 않은 것, 그게 유일한 기준이었다." },
    { t:"짐을 묶어 고정하고 낮은 곳에 붙어 지나가기를 기다린다", ok:true, d:{energy:1}, note:"폭풍에는 이기는 방법이 없고 버티는 방법만 있다." },
    { t:"가장 크고 튼튼한 나무 아래로 들어가 비를 피한다", ok:false, d:{energy:-1}, note:"벼락은 가장 높은 것을 친다. 비를 피하려고 피뢰침 아래로 들어간 것이다." },
    { t:"젖으면 체온이 떨어지니 동굴 입구에 선다", ok:false, d:{energy:-1}, note:"동굴 입구와 바위 틈은 전류가 지나가는 통로가 된다. 들어가려면 깊이 들어가야 했다." },
    { t:"땅에 납작 엎드려 몸을 최대한 붙인다", ok:false, d:{energy:-1}, note:"지면을 타고 흐르는 전류는 몸이 땅에 많이 닿을수록 위험하다. 웅크려 접지 면적을 줄여야 했다." }]},

{ id:"J34", kind:"준비", title:"여과기",
  body:"흙탕물밖에 없다. 자갈과 모래, 어제 남은 숯은 있다.",
  choices:[
    { t:"여과기로 흙을 걸러낸 뒤 그 물을 다시 끓인다", ok:true, d:{water:1}, note:"여과와 살균은 별개의 공정이라는 걸 알고 있었다." },
    { t:"흙탕물을 그릇에 받아 하룻밤 가라앉힌 뒤 윗물만 떠서 끓인다", ok:true, d:{water:1}, note:"시간이 가장 값싼 여과기였다." },
    { t:"숯까지 넣어 제대로 만들었으니 걸러진 물은 그냥 마신다", ok:false, d:{food:-1}, note:"여과는 눈에 보이는 것을 걸러낸다. 병을 일으키는 것은 애초에 눈에 보이지 않았다." },
    { t:"여과기를 여러 번 통과시키면 살균이 된다", ok:false, d:{water:-1}, note:"몇 번을 통과시켜도 미생물은 그대로다. 반복은 시간만 썼다." },
    { t:"모래가 고울수록 좋으니 강가의 진흙에 가까운 흙을 쓴다", ok:false, d:{water:-1}, note:"고운 흙은 걸러내는 게 아니라 물에 섞인다. 여과기가 오염원이 됐다." }]},

{ id:"J35", kind:"준비", title:"칼",
  body:"자를 것은 많은데 쓸 만한 칼이 없다.",
  choices:[
    { t:"큰 조개껍데기를 깨서 날이 선 조각을 골라 쓴다", ok:true, d:{food:1}, note:"바다가 만들어둔 날이었다." },
    { t:"단단한 돌 두 개를 부딪쳐 깨진 면의 날카로운 조각을 쓴다", ok:true, d:{food:1}, note:"인류가 가장 오래 쓴 방법이 여기서도 통했다." },
    { t:"대나무를 비스듬히 잘라 자르는 도구로 쓴다", ok:false, d:{energy:-1}, note:"대나무 날은 놀랄 만큼 날카롭고, 놀랄 만큼 쉽게 부러져 살에 박힌다. 도구가 아니라 부상 원인이 됐다." },
    { t:"부드러운 돌을 갈아 매끄러운 날을 만든다", ok:false, d:{energy:-1}, note:"갈아서 날이 서는 건 단단한 돌이다. 며칠을 갈았지만 날은 서지 않았다." },
    { t:"나무를 깎아 칼을 만들고 불에 그을려 단단하게 한다", ok:false, d:{food:-1}, note:"불에 굳힌 나무는 찌르는 데는 쓰이지만 자르는 날은 되지 않는다." }]},

{ id:"J36", kind:"준비", title:"지붕",
  body:"비가 새는 지붕을 다시 이어야 한다.",
  choices:[
    { t:"아래쪽부터 시작해 위쪽 잎이 아래쪽 잎을 덮도록 겹쳐 올린다", ok:true, d:{energy:1}, note:"기와를 얹는 순서와 같은 원리였다." },
    { t:"지붕에 충분한 경사를 주고 잎맥이 아래를 향하게 놓는다", ok:true, d:{energy:1}, note:"잎맥이 물길이 됐다." },
    { t:"위에서부터 잎을 깔아 내려온다", ok:false, d:{energy:-1}, note:"물은 위에서 아래로 흐른다. 겹치는 방향이 반대면 잎 사이마다 물이 들어가는 입구가 된다." },
    { t:"잎을 두껍게 쌓으면 경사는 완만해도 된다", ok:false, d:{energy:-1}, note:"완만한 지붕은 물이 고인다. 두께는 경사를 대신하지 못한다." },
    { t:"큰 잎 한 장으로 넓은 면적을 덮는다", ok:false, d:{water:-1}, note:"한 장짜리 지붕은 찢어지는 순간 전부다. 여러 장이 겹쳐야 한 곳이 새도 버틴다." }]},

{ id:"J37", kind:"준비", title:"화장실",
  body:"사흘째. 야영지 주변이 지저분해지고 파리가 늘었다.",
  choices:[
    { t:"야영지와 물가 양쪽에서 멀리 떨어진 곳에 구덩이를 파고 매번 흙을 덮는다", ok:true, d:{energy:1}, note:"한 번의 삽질이 며칠의 설사를 막았다." },
    { t:"물을 뜨는 곳보다 아래쪽, 물이 흘러 들어가지 않는 방향에 자리를 정한다", ok:true, d:{energy:1}, note:"위아래를 따진 판단이 정확했다." },
    { t:"개울에서 처리하면 물이 씻어가니 깨끗하다", ok:false, d:{energy:-1}, note:"그 물이 흘러가는 곳에서 둘이 물을 뜬다. 조난 상황에서 위생 실패는 맹수보다 훨씬 앞선 사망 원인이다." },
    { t:"매번 자리를 옮겨 한곳이 더러워지지 않게 한다", ok:false, d:{energy:-1}, note:"야영지 주변 전체가 지뢰밭이 됐다. 파리가 그 사이를 오간다." },
    { t:"볕에 마르면 문제없으니 흙을 덮지 않는다", ok:false, d:{food:-1}, note:"덮지 않은 배설물은 파리를 부른다. 그 파리가 그대로 음식에 앉는다." }]},

{ id:"J38", kind:"준비", title:"날짜",
  body:"며칠째인지 헷갈리기 시작한다. 딸도 오늘이 무슨 요일이냐고 묻는다.",
  choices:[
    { t:"매일 같은 시간에 나무에 금을 하나씩 긋는다", ok:true, d:{energy:1}, note:"금 하나가 하루를 붙잡아 뒀다." },
    { t:"아침·점심·저녁에 할 일을 정해두고 그 순서로 하루를 센다", ok:true, d:{energy:1}, note:"일과가 곧 달력이 됐다." },
    { t:"날짜는 중요하지 않으니 세지 않는다", ok:false, d:{energy:-1}, note:"시간 감각을 놓치는 것이 장기 조난에서 정신이 무너지는 첫 단계다. 무엇을 언제 했는지 모르면 판단도 어긋난다." },
    { t:"기억해두었다가 나중에 한꺼번에 표시한다", ok:false, d:{energy:-1}, note:"비슷한 하루가 이어지면 기억은 며칠씩 뭉개진다. 사흘이 하루로 줄어 있었다." },
    { t:"달의 모양을 보고 날짜를 계산한다", ok:false, d:{energy:-1}, note:"흐린 밤이 며칠만 이어져도 셈이 끊긴다. 확인할 수 없는 기준은 기준이 아니다." }]},

{ id:"J39", kind:"심리", title:"지나간 배",
  body:"수평선에 배가 지나갔다. 불을 피웠지만 보지 못하고 사라졌다. 딸이 모래밭에 주저앉는다.",
  choices:[
    { t:"다음을 위한 신호를 미리 준비해두는 일을 오늘 안에 함께 한다", ok:true, d:{morale:1}, note:"할 일이 생기자 딸이 일어났다." },
    { t:"배가 지나갔다는 건 이 앞에 항로가 있다는 뜻이라고 설명한다", ok:true, d:{morale:1}, note:"같은 사실을 다른 각도에서 보여줬다." },
    { t:"아쉬워해봐야 소용없으니 아무 일 없던 것처럼 넘어간다", ok:false, d:{morale:-1}, note:"감정을 지나치면 사라지는 게 아니라 쌓인다. 딸은 그날 이후 수평선을 보지 않았다." },
    { t:"다음 배는 곧 올 거라고 확신을 준다", ok:false, d:{morale:-1}, note:"근거 없는 약속은 지켜지지 않을 때 두 배로 무너진다." },
    { t:"놓친 이유를 짚어 무엇을 잘못했는지 함께 따져본다", ok:false, d:{morale:-1}, note:"원인을 찾는 건 어른의 방식이다. 딸에게 남은 건 자기 탓이라는 감각뿐이었다." }]},

{ id:"J40", kind:"심리", title:"말이 없다",
  body:"딸이 며칠째 말이 없다. 시키는 일은 하지만 먼저 입을 열지 않는다.",
  choices:[
    { t:"대답이 필요 없는 일을 나란히 앉아 함께 한다", ok:true, d:{morale:1}, note:"말 없는 시간을 함께 보내는 게 먼저였다." },
    { t:"하루 한 번, 오늘 좋았던 것 하나씩만 서로 말하기로 정한다", ok:true, d:{morale:1}, note:"작고 지킬 수 있는 약속이 문을 열었다." },
    { t:"무슨 일이냐고 물어 마음을 열게 한다", ok:false, d:{morale:-1}, note:"말할 수 없는 상태에서 받는 질문은 요구가 된다. 딸은 더 입을 닫았다." },
    { t:"기운 내라고 격려하며 밝은 이야기를 계속 한다", ok:false, d:{morale:-1}, note:"혼자만 밝은 목소리는 거리감을 만든다. 자기 감정이 틀렸다고 느끼게 했다." },
    { t:"스스로 회복하도록 시간을 준다", ok:false, d:{morale:-1}, note:"무기력은 오래 두면 습관이 된다. 기다리는 동안 굳어버렸다." }]},

{ id:"J41", kind:"심리", title:"아빠 때문이야",
  body:"딸이 소리친다. 아빠가 그 배를 타자고 해서 이렇게 됐다고.",
  choices:[
    { t:"그 말이 맞다고 인정하고, 그래서 반드시 데리고 나가겠다고 말한다", ok:true, d:{morale:1}, note:"인정과 약속을 같이 준 게 정확했다." },
    { t:"화난 게 당연하다고 말한 뒤, 다 말할 때까지 듣는다", ok:true, d:{morale:1}, note:"감정에 이름을 붙여주자 크기가 줄었다." },
    { t:"지금 그런 말을 할 때가 아니라고 잘라 말한다", ok:false, d:{morale:-1}, note:"분노를 막으면 사라지지 않고 방향만 바뀐다. 다음에는 자기 자신을 향한다." },

{ id:"D09", kind:"자원", title:"개미의 길",

    { t:"쏘인 자리를 째서 독을 빼낸다", ok:false, d:{energy:-1}, note:"절개는 독을 빼지 못하고 감염 경로만 만든다." }]},

{ id:"D18", kind:"위기", title:"멀리 보이는 물",
  body:"저 앞에 물이 반짝인다. 딸이 달려가려 한다.",
  choices:[
    { t:"눈높이를 낮춰 다시 본다. 낮추자 물이 사라진다", ok:true, d:{energy:1}, note:"신기루는 낮은 각도에서만 보인다. 확인하는 데 3초면 됐다." },
    { t:"위치를 표시해두고 해가 기운 뒤 다시 확인한다", ok:true, d:{energy:1}, note:"뜨거운 공기가 식자 아무것도 없었다." },
    { t:"물이 마르기 전에 서둘러 달려간다", ok:false, d:{water:-1}, note:"가까워질수록 물은 뒤로 물러났다. 달린 만큼 잃었다." },
    { t:"물이 보이니 가진 물을 마음 놓고 다 마신다", ok:false, d:{water:-1}, note:"보이는 물을 믿고 가진 물을 버렸다. 사막에서 가장 흔한 최후의 실수다." },
    { t:"딸을 먼저 보내 확인하게 한다", ok:false, d:{energy:-1}, note:"아무것도 없는 곳으로 아이를 혼자 보냈다." }]},

{ id:"D19", kind:"위기", title:"마른 계곡의 물소리",
  body:"멀리서 천둥이 친다. 이곳은 비 한 방울 안 왔는데, 계곡 위쪽에서 소리가 난다.",
  choices:[
    { t:"즉시 계곡 밖 높은 곳으로 올라간다", ok:true, d:{energy:1}, note:"몇 분 뒤 계곡 바닥으로 흙탕물이 쏟아졌다." },
    { t:"계곡 안에서는 야영하지 않기로 하고 자리를 옮긴다", ok:true, d:{energy:1}, note:"마른 계곡이 마른 데는 이유가 있고, 젖는 데도 이유가 있다." },
    { t:"여기는 비가 안 오니 상관없다고 판단한다", ok:false, d:{energy:-1}, note:"사막의 홍수는 몇십 킬로미터 밖의 비가 만든다. 하늘이 맑아도 물은 온다." },
    { t:"물이 온다면 좋은 일이니 통을 준비하고 기다린다", ok:false, d:{energy:-1}, note:"오는 것은 마실 물이 아니라 벽처럼 밀려오는 흙탕물이었다." },
    { t:"계곡을 따라 아래로 빠르게 내려간다", ok:false, d:{energy:-1}, note:"물이 가는 길로 함께 내려갔다. 옆으로 나갔어야 했다." }]},

{ id:"D20", kind:"위기", title:"모래 위의 자국",
  body:"모래에 이상한 자국이 옆으로 이어져 있다. 뱀이 지나간 흔적이다.",
  choices:[
    { t:"밟기 전에 발밑을 보며 걷고, 밤에는 불빛으로 앞을 비춘다", ok:true, d:{energy:1}, note:"조심하는 것이 유일한 방법이었다." },
    { t:"돌과 마른 덤불 근처를 피해 돌아간다", ok:true, d:{energy:1}, note:"뱀이 있을 만한 자리를 피했다." },
    { t:"자국을 따라가 뱀을 찾아 잡는다", ok:false, d:{energy:-1}, note:"고기 한 끼를 위해 스스로 위험을 찾아갔다." },
    { t:"낮에는 뱀이 없으니 마음 놓고 걷는다", ok:false, d:{energy:-1}, note:"사막 뱀은 한낮의 열을 피해 그늘에 있다. 그늘이 곧 사람이 쉬는 자리다." },
    { t:"막대로 덤불을 헤쳐 먼저 쫓아낸다", ok:false, d:{energy:-1}, note:"헤친 자리에서 튀어나온 것을 피할 거리가 없었다." }]},

{ id:"D21", kind:"위기", title:"모래언덕",
  body:"높은 모래언덕이 앞을 막았다. 넘어야 반대편이 보인다.",
  choices:[
    { t:"능선을 따라 완만한 곳으로 돌아 오른다", ok:true, d:{energy:1}, note:"돌아가는 길이 더 빨랐다." },
    { t:"해가 낮을 때 그늘진 면으로 오른다", ok:true, d:{energy:1}, note:"그늘 쪽 모래는 단단하고 시원했다." },
    { t:"가장 짧은 직선으로 곧장 오른다", ok:false, d:{energy:-1}, note:"급경사의 마른 모래는 한 걸음 오르면 반 걸음 미끄러진다. 두 배의 힘이 들었다." },
    { t:"내려갈 때는 빠르니 뛰어 내려간다", ok:false, d:{energy:-1}, note:"발목이 모래에 박혔다. 사막에서 못 걷게 되는 건 끝을 뜻한다." },
    { t:"언덕 꼭대기에 자리를 잡고 쉰다", ok:false, d:{water:-1}, note:"꼭대기는 바람과 햇볕을 그대로 받는다. 쉰 게 아니라 말랐다." }]},

{ id:"D22", kind:"위기", title:"들개 무리",
  body:"마른 짐승 몇 마리가 멀찍이서 따라온다. 사라지지 않는다.",
  choices:[
    { t:"불을 피우고 둘이 붙어 서서 크게 소리를 낸다", ok:true, d:{energy:1}, note:"무리는 만만해 보이는 쪽을 고른다. 만만해 보이지 않았다." },
    { t:"등을 바위에 붙여 뒤를 막고 막대를 들어 마주 본다", ok:true, d:{energy:1}, note:"둘러싸이지 않는 것이 전부였다." },
    { t:"먹을 것을 던져주고 그 사이 떠난다", ok:false, d:{food:-1}, note:"먹이를 준 순간 무리는 계속 따라왔다. 다음 날도, 그다음 날도." },
    { t:"등을 보이고 빠르게 걸어 벗어난다", ok:false, d:{energy:-1}, note:"등을 보인 순간 거리가 좁혀졌다." },
    { t:"딸을 안고 뛰어 거리를 벌린다", ok:false, d:{energy:-1}, note:"무리는 달리는 것을 쫓도록 만들어진 짐승이다." }]},

{ id:"D23", kind:"위기", title:"밤의 이동",
  body:"밤에 움직이기로 했다. 달빛은 있지만 발밑이 잘 보이지 않는다.",
  choices:[
    { t:"막대로 앞을 짚어가며 천천히 걷는다", ok:true, d:{energy:1}, note:"막대 하나가 눈을 대신했다." },
    { t:"딸을 앞세우지 않고 아빠가 앞서 발밑을 확인하며 간다", ok:true, d:{energy:1}, note:"순서를 정한 게 정확했다." },
    { t:"시원하니 속도를 내서 최대한 멀리 간다", ok:false, d:{energy:-1}, note:"밤의 사막에서 서두름은 발목으로 돌아온다." },
    { t:"길을 잃지 않게 계속 이야기하며 걷는다", ok:false, d:{water:-1}, note:"말할 때마다 숨으로 수분이 나간다. 사막에서는 입을 닫는 것도 절약이다." },
    { t:"달이 지면 어차피 못 보니 새벽까지 쉬지 않고 간다", ok:false, d:{energy:-1}, note:"쉬지 않은 몸이 새벽에 무너졌다." }]},

{ id:"D24", kind:"준비", title:"그늘 만들기",
  body:"그늘이 될 만한 바위가 없다. 천과 막대는 있다.",
  choices:[
    { t:"천을 두 겹으로 띄워 걸고 사이에 공기가 지나가게 한다", ok:true, d:{energy:1}, note:"두 겹 사이의 공기층이 온도를 크게 낮췄다." },
    { t:"땅을 조금 파고 그 위에 천을 씌워 바닥의 열을 피한다", ok:true, d:{energy:1}, note:"모래 한 뼘 아래가 훨씬 시원했다." },
    { t:"천을 땅에 바짝 붙여 덮어 햇빛을 완전히 막는다", ok:false, d:{energy:-1}, note:"바짝 붙인 천 아래는 열이 갇힌다. 그늘이 아니라 찜통이 됐다." },
    { t:"두꺼운 천 한 장이면 충분하니 한 겹만 친다", ok:false, d:{energy:-1}, note:"두께보다 겹 사이의 공기가 일한다." },
    { t:"모래 속에 몸을 묻어 더위를 피한다", ok:false, d:{water:-1}, note:"표면 모래는 뜨겁고, 묻힌 몸은 땀을 흘려도 식지 않는다." }]},

{ id:"D25", kind:"준비", title:"물을 담아둘 곳",
  body:"물을 찾았다. 문제는 담아둘 것과 두는 자리다.",
  choices:[
    { t:"통을 젖은 천으로 감싸 그늘에 매달아 둔다", ok:true, d:{water:1}, note:"천이 마르며 통을 식혔다." },
    { t:"땅을 파고 통을 모래 속에 묻어 둔다", ok:true, d:{water:1}, note:"모래 아래는 한낮에도 서늘했다." },
    { t:"잘 보이는 곳에 두어야 잊지 않으니 밖에 둔다", ok:false, d:{water:-1}, note:"뚜껑을 열 때마다 뜨거운 물이 나왔다. 미지근한 물은 더 마시게 만든다." },
    { t:"바위 위에 두어 짐승이 못 건드리게 한다", ok:false, d:{water:-1}, note:"바위는 낮 동안 달궈진 화덕이다." },
    { t:"물을 여러 통에 나눠 여기저기 숨겨둔다", ok:false, d:{water:-1}, note:"어디에 뒀는지 헷갈렸다. 두 통은 끝내 못 찾았다." }]},

{ id:"D26", kind:"준비", title:"눈에 띄는 법",
  body:"사막은 넓고 텅 비어 있다. 눈에 띄려면 어떻게 해야 할까.",
  choices:[
    { t:"어두운 돌로 밝은 모래 위에 큰 표시 하나를 만든다", ok:true, d:{energy:1}, note:"사막에서는 색의 대비가 가장 잘 보인다." },
    { t:"거울이나 반짝이는 조각을 늘 몸에 지니고 다닌다", ok:true, d:{energy:1}, note:"맑은 하늘 아래 반사광은 몇 킬로미터를 간다." },
    { t:"불을 크게 피워 연기를 낸다", ok:false, d:{energy:-1}, note:"땔감이 거의 없는 곳에서 큰 불은 하루치 노동이었다. 게다가 마른 연기는 옅어 잘 보이지 않는다." },
    { t:"밝은 색 천을 땅에 펴 둔다", ok:false, d:{energy:-1}, note:"밝은 모래 위의 밝은 천은 구별되지 않는다. 어두운 것을 써야 했다." },
    { t:"표시를 여러 개 만들어 넓게 흩어 놓는다", ok:false, d:{energy:-1}, note:"흩어진 작은 표시는 자연 지형으로 보인다." }]},

{ id:"D27", kind:"준비", title:"하루를 나누는 법",
  body:"언제 움직이고 언제 쉴지를 정해야 한다.",
  choices:[
    { t:"새벽과 해질녘에 움직이고 한낮은 그늘에서 쉰다", ok:true, d:{energy:1}, note:"사막에서 시간은 지형만큼 중요하다." },
    { t:"한낮에는 자고 밤 시간에 일을 몰아서 한다", ok:true, d:{energy:1}, note:"낮과 밤을 바꿔 살았다." },
    { t:"체력이 있는 아침 일찍부터 해질 때까지 계속 움직인다", ok:false, d:{water:-1}, note:"한낮 두 시간의 소모가 아침 다섯 시간보다 컸다." },
    { t:"더울 때 움직여야 밤에 잘 잔다", ok:false, d:{water:-1}, note:"잠은 그늘에서도 잘 수 있다. 물은 다시 만들 수 없다." },
    { t:"매일 다르게 정해 그날 기분에 맞춘다", ok:false, d:{energy:-1}, note:"규칙이 없으면 판단이 매번 처음부터다. 지친 머리가 매번 틀렸다." }]},

{ id:"D28", kind:"준비", title:"발",
  body:"모래가 신발 안으로 계속 들어온다. 발바닥이 화끈거린다.",
  choices:[
    { t:"발목을 천으로 감아 모래가 들어오는 입구를 막는다", ok:true, d:{energy:1}, note:"천 한 뼘이 물집 여러 개를 막았다." },
    { t:"쉴 때마다 신발을 벗어 모래를 털고 발을 식힌다", ok:true, d:{energy:1}, note:"자주 터는 게 전부였다." },
    { t:"모래가 시원하니 맨발로 걷는다", ok:false, d:{energy:-1}, note:"표면 모래는 한낮에 화상을 입힐 만큼 뜨겁다. 그늘의 모래만 시원하다." },
    { t:"신발을 꽉 조여 모래가 못 들어오게 한다", ok:false, d:{energy:-1}, note:"조인 신발은 부은 발을 더 조인다. 저녁에 벗을 수가 없었다." },
    { t:"물집이 생기면 터뜨리고 계속 걷는다", ok:false, d:{energy:-1}, note:"터진 물집은 모래가 들어가는 상처가 됐다." }]},

{ id:"D29", kind:"준비", title:"땔감",
  body:"밤에 불을 피우려는데 나무가 거의 없다.",
  choices:[
    { t:"마른 덤불과 뿌리를 모으고, 불은 작게 오래 유지한다", ok:true, d:{energy:1}, note:"작은 불로 충분했다." },
    { t:"마른 짐승 똥을 모아 연료로 쓴다", ok:true, d:{energy:1}, note:"유목민이 수천 년 써온 연료였다." },
    { t:"살아 있는 덤불을 베어 땔감으로 쓴다", ok:false, d:{energy:-1}, note:"물기 있는 가지는 타지 않고 연기만 냈다. 그마저도 이 사막에서는 몇 안 되는 그늘이었다." },
    { t:"불을 크게 피워 밤새 따뜻하게 지낸다", ok:false, d:{energy:-1}, note:"이 사막의 밤은 얼어붙지 않는다. 하룻밤에 며칠치 연료를 태웠다." },
    { t:"땔감이 없으니 불을 포기한다", ok:false, d:{food:-1}, note:"불 없이는 익힐 수도, 물을 끓일 수도 없었다." }]},

{ id:"D30", kind:"준비", title:"돌아올 길",
  body:"물을 찾아 멀리 나가야 한다. 사방이 똑같이 생겼다.",
  choices:[
    { t:"일정한 간격으로 돌을 쌓아 표시를 남기며 간다", ok:true, d:{energy:1}, note:"돌무더기가 길이 됐다." },
    { t:"멀리 보이는 특징적인 바위를 기준 삼아 방향을 유지한다", ok:true, d:{energy:1}, note:"움직이지 않는 것 하나면 충분했다." },
    { t:"모래에 발자국이 남으니 그걸 따라 돌아온다", ok:false, d:{energy:-1}, note:"바람 한 번이면 발자국은 사라진다." },
    { t:"해의 방향만 기억해두고 간다", ok:false, d:{energy:-1}, note:"해는 하루 동안 움직인다. 아침의 방향으로 저녁에 돌아왔다." },
    { t:"멀리 갈수록 좋으니 표시할 시간에 더 걷는다", ok:false, d:{energy:-1}, note:"돌아오는 길을 잃으면 찾은 물도 소용이 없다." }]},

{ id:"D31", kind:"심리", title:"딸이 물을 더 달라고 한다",
  body:"딸이 계속 목이 마르다고 한다. 남은 물은 정해져 있다.",
  choices:[
    { t:"지금 조금 주고, 다음에 언제 줄지 시각을 함께 정한다", ok:true, d:{morale:1}, note:"기다림에 끝이 보이자 견딜 만해졌다." },
    { t:"물을 아껴야 하는 이유를 숫자로 보여주고 함께 계산한다", ok:true, d:{morale:1}, note:"아이는 이유를 알면 훨씬 잘 참는다." },
    { t:"참으라고 하고 더 말하지 못하게 한다", ok:false, d:{morale:-1}, note:"참으라는 말만으로 참을 수 있는 아이는 없다. 딸은 몰래 마시기 시작했다." },
    { t:"아빠 몫까지 다 주고 아빠는 마시지 않는다", ok:false, d:{morale:-1}, note:"아빠가 쓰러지면 딸도 끝이다. 딸도 그걸 알고 있어서 물을 마실 때마다 죄책감을 느꼈다." },
    { t:"내일이면 물을 찾을 거라고 안심시킨다", ok:false, d:{morale:-1}, note:"내일 못 찾았을 때 잃는 것이 물보다 컸다." }]},

{ id:"D32", kind:"심리", title:"아무 일도 일어나지 않는 하루",
  body:"할 일을 다 했다. 해가 지려면 아직 멀었고, 딸이 지루해한다.",
  choices:[
    { t:"돌로 놀이판을 만들어 규칙을 정하고 함께 논다", ok:true, d:{morale:1}, note:"놀이는 사치가 아니라 정신을 지키는 일이었다." },
    { t:"딸에게 이 사막에서 본 것을 하나씩 이야기해보게 한다", ok:true, d:{morale:1}, note:"말할 거리가 생기자 하루에 모양이 생겼다." },
    { t:"체력을 아껴야 하니 아무것도 하지 않고 누워 있게 한다", ok:false, d:{morale:-1}, note:"아무것도 하지 않는 시간이 가장 빠르게 사람을 갉아먹는다." },
    { t:"쓸데없는 일 대신 할 일을 더 시킨다", ok:false, d:{morale:-1}, note:"쉬는 시간까지 일이 되자 딸은 아무 말도 하지 않게 됐다." },
    { t:"집에 돌아가면 할 일들을 이야기한다", ok:false, d:{morale:-1}, note:"돌아갈 수 없는 곳 이야기가 길어질수록 지금이 초라해졌다." }]},

{ id:"D33", kind:"심리", title:"몰래 마신 물",
  body:"물통이 생각보다 가볍다. 딸이 눈을 피한다.",
  choices:[
    { t:"혼내지 않고, 앞으로는 마시고 싶으면 말하라고 한다", ok:true, d:{morale:1}, note:"숨기지 않게 만드는 게 먼저였다." },
    { t:"물통을 함께 관리하고 하루치를 눈에 보이게 나눠 둔다", ok:true, d:{morale:1}, note:"규칙이 보이자 몰래 마실 일이 없어졌다." },
    { t:"이런 일이 생기지 않게 크게 화를 낸다", ok:false, d:{morale:-1}, note:"다음부터는 더 잘 숨겼다." },
    { t:"물통을 아빠가 혼자 관리하고 딸에게는 주지 않는다", ok:false, d:{morale:-1}, note:"믿지 않는다는 신호였다. 딸은 그날 이후 아무것도 먼저 말하지 않았다." },
    { t:"못 본 척 넘어간다", ok:false, d:{morale:-1}, note:"규칙이 없다는 걸 배운 아이는 다음에 더 마셨다." }]},

{ id:"D34", kind:"심리", title:"보이지 않는 것",
  body:"딸이 저기 사람이 있다고 한다. 아빠 눈에는 아무것도 없다.",
  choices:[
    { t:"함께 가서 확인해보고, 없다는 걸 같이 본다", ok:true, d:{morale:1}, note:"부정하는 대신 함께 확인했다." },
    { t:"물을 마시고 그늘에서 쉬게 한 뒤 다시 물어본다", ok:true, d:{morale:1}, note:"헛것은 몸이 보내는 신호였다." },
    { t:"헛것이라고 잘라 말한다", ok:false, d:{morale:-1}, note:"본인에게는 분명히 보인 것이었다. 딸은 그 뒤로 무엇을 봐도 말하지 않았다." },
    { t:"딸을 안심시키려 아빠도 보인다고 맞장구쳐 준다", ok:false, d:{morale:-1}, note:"둘 다 없는 것을 향해 걸었다." },
    { t:"피곤해서 그런 것이니 더 걸으면 나아진다고 한다", ok:false, d:{morale:-1}, note:"더 걸을수록 심해졌다." }]},

{ id:"D35", kind:"심리", title:"별",
  body:"사막의 밤하늘은 믿기 어려울 만큼 밝다. 딸이 하늘을 올려다본다.",
  choices:[
    { t:"별자리를 함께 찾아보고 이름을 붙여준다", ok:true, d:{morale:1}, note:"이 사막에서 유일하게 아름다운 것을 딸에게 줬다." },
    { t:"북쪽을 알려주는 별을 찾아 함께 방향을 익힌다", ok:true, d:{morale:1}, note:"아름다운 것이 동시에 쓸모 있는 것이 됐다." },
    { t:"내일을 위해 빨리 자라고 한다", ok:false, d:{morale:-1}, note:"하루에 좋은 순간이 하나도 없으면 다음 날이 더 무겁다." },
    { t:"별을 보며 집에서 보던 하늘 이야기를 오래 한다", ok:false, d:{morale:-1}, note:"딸이 조용해졌다. 같은 하늘이 다른 곳에 있다는 사실이 더 아팠다." },
    { t:"별이 밝으니 밤새 걷자고 제안한다", ok:false, d:{energy:-1}, note:"쉬어야 할 시간을 이동에 썼다." }]},

{ id:"D36", kind:"심리", title:"서로에게 화가 난다",
  body:"사소한 일로 언성이 높아졌다. 둘 다 지쳐 있다.",
  choices:[
    { t:"지금은 말하지 말고 물을 마시고 그늘에서 쉬자고 한다", ok:true, d:{morale:1}, note:"화의 절반은 더위와 갈증이었다." },
    { t:"해가 진 뒤에 다시 이야기하기로 정한다", ok:true, d:{morale:1}, note:"미룬 게 아니라 조건을 바꿨다." },
    { t:"지금 확실히 짚고 넘어간다", ok:false, d:{morale:-1}, note:"탈수 상태의 대화는 어떤 결론에도 이르지 못한다." },
    { t:"아빠가 무조건 참고 넘어간다", ok:false, d:{morale:-1}, note:"참은 것이 쌓여 다음번에 더 크게 터졌다." },
    { t:"서로 떨어져서 각자 시간을 보낸다", ok:false, d:{morale:-1}, note:"사막에서 떨어지는 건 감정 문제가 아니라 안전 문제였다." }]},

{ id:"D37", kind:"심리", title:"딸의 일",
  body:"딸이 자기도 뭔가 하고 싶다고 한다. 하지만 이 사막에서 시킬 만한 일이 마땅치 않다.",
  choices:[
    { t:"매일 이슬 받는 일을 딸에게 맡긴다", ok:true, d:{morale:1}, note:"작지만 확실히 결과가 보이는 일이었다." },
    { t:"날짜를 세고 남은 물을 기록하는 일을 맡긴다", ok:true, d:{morale:1}, note:"기록하는 사람이 되자 태도가 달라졌다." },
    { t:"위험하니 아무것도 시키지 않고 쉬게 한다", ok:false, d:{morale:-1}, note:"쓸모없다고 느끼는 것이 아이에게는 가장 무거운 짐이다." },
    { t:"어른이 하는 일을 똑같이 나눠 맡긴다", ok:false, d:{energy:-1}, note:"할 수 없는 일을 맡기자 실패가 쌓였다." },
    { t:"하고 싶은 걸 스스로 찾아보라고 한다", ok:false, d:{morale:-1}, note:"막막함 앞에 혼자 세워두는 건 도움이 아니었다." }]},

{ id:"D38", kind:"심리", title:"그만하고 싶다",
  body:"딸이 더는 못 걷겠다고, 그냥 여기 있겠다고 한다.",
  choices:[
    { t:"저기 보이는 바위까지만 가자고, 목표를 눈에 보이는 데까지로 줄인다", ok:true, d:{morale:1}, note:"멀리 보면 못 가지만 바위 하나는 갈 수 있었다." },
    { t:"지금 앉아서 쉬되, 몇 분 뒤에 일어나기로 시각을 정한다", ok:true, d:{morale:1}, note:"끝이 정해진 휴식은 포기가 아니다." },
    { t:"일어나라고 강하게 밀어붙인다", ok:false, d:{morale:-1}, note:"몸이 아니라 마음이 멈춘 것이었다. 밀수록 더 굳었다." },
    { t:"아빠가 업고 간다", ok:false, d:{energy:-1}, note:"한 사람의 체력으로 두 사람을 옮겼다. 다음 날 둘 다 못 움직였다." },
    { t:"여기서 구조를 기다리자고 함께 주저앉는다", ok:false, d:{morale:-1}, note:"물도 그늘도 없는 자리였다. 기다림에도 자리가 필요했다." }]},

{ id:"D39", kind:"함정", title:"마른 우물",
  body:"돌로 쌓은 오래된 우물을 찾았다. 안이 깊고 어둡다.",
  choices:[
    { t:"돌을 떨어뜨려 소리로 깊이와 물 여부를 먼저 확인한다", ok:true, d:{water:1}, note:"내려가기 전에 확인한 게 정확했다." },
    { t:"우물이 있다는 건 지하수가 얕다는 뜻이다. 주변을 파본다", ok:true, d:{water:1}, note:"우물 자체보다 우물이 있다는 사실이 정보였다." },
    { t:"바로 내려가서 바닥을 확인한다", ok:false, d:{energy:-1}, note:"오래된 우물 바닥에는 무거운 기체가 고인다. 내려가는 순간 숨이 막힌다." },
    { t:"바닥에 고인 물이 보이니 그대로 퍼서 마신다", ok:false, d:{food:-1}, note:"우물 바닥의 고인 물에는 빠져 죽은 것들이 함께 있다." },
    { t:"우물이 있으니 사람이 온다. 여기서 기다린다", ok:false, d:{food:-1}, note:"버려진 우물은 사람이 오지 않게 된 지 오래라는 뜻이다." }]},

{ id:"D40", kind:"함정", title:"물가의 뼈",
  body:"작은 웅덩이를 찾았다. 그런데 물가에 짐승 뼈가 여러 구 흩어져 있다.",
  choices:[
    { t:"뼈가 여럿이라는 걸 위험 신호로 보고 마시지 않는다", ok:true, d:{energy:1}, note:"참는 판단이 살렸다." },
    { t:"웅덩이 위쪽으로 올라가 흘러드는 쪽에서 뜬다", ok:true, d:{water:1}, note:"같은 물이라도 위와 아래는 다르다." },
    { t:"짐승들이 마시러 온 자리이니 안전한 물이다", ok:false, d:{water:-1}, note:"마시러 왔다가 죽은 자리일 수도 있다. 뼈가 여럿이라는 게 그 답이었다." },
    { t:"물을 끓여서 마신다", ok:false, d:{food:-1}, note:"끓이면 세균은 죽지만 광물 독성은 그대로다. 사막의 고인 물은 비소나 중금속이 농축돼 있을 수 있다." },
    { t:"뼈만 치우고 물을 뜬다", ok:false, d:{water:-1}, note:"보이는 것을 치웠을 뿐이다." }]},

{ id:"D41", kind:"함정", title:"흰 테두리의 웅덩이",
  body:"물이 고인 곳을 찾았다. 가장자리에 흰 테두리가 둘러 있다.",
  choices:[
    { t:"흰 테두리를 보고 소금물로 판단해 마시지 않는다", ok:true, d:{energy:1}, note:"테두리가 답을 알려주고 있었다." },
    { t:"이 물로 소금만 얻고, 마실 물은 따로 찾는다", ok:true, d:{food:1}, note:"쓸 수 있는 만큼만 썼다." },
    { t:"물이 맑으니 한 모금만 마셔본다", ok:false, d:{water:-1}, note:"흰 테두리는 증발하고 남은 염분이다. 한 모금이 갈증을 두 배로 만들었다." },
    { t:"끓여서 소금을 날린 뒤 마신다", ok:false, d:{energy:-1}, note:"끓이면 물이 날아가고 소금이 남는다. 반대로 알고 있었다." },
    { t:"모래에 걸러서 마신다", ok:false, d:{water:-1}, note:"소금은 녹아 있다. 걸러지지 않는다." }]},

{ id:"D42", kind:"함정", title:"버려진 야영지",
  body:"천막 뼈대와 녹슨 깡통, 낡은 담요가 남아 있다. 사람이 있었던 자리다.",
  choices:[
    { t:"천막 천과 끈을 챙겨 그늘막에 쓴다", ok:true, d:{energy:1}, note:"만들 수 없는 것을 얻었다." },
    { t:"깡통을 씻어 물통과 조리 도구로 쓴다", ok:true, d:{water:1}, note:"금속 그릇 하나가 큰 차이를 만들었다." },
    { t:"사람이 있었으니 다시 온다. 여기서 기다린다", ok:false, d:{food:-1}, note:"버려진 야영지는 이곳이 쓸모없어졌다는 뜻이다. 며칠을 아무것도 하지 않고 보냈다." },
    { t:"남아 있는 음식을 찾아 먹는다", ok:false, d:{food:-1}, note:"남겨진 음식은 가져갈 가치가 없었던 것이다. 이유가 있었다." },
    { t:"담요를 그대로 덮고 잔다", ok:false, d:{energy:-1}, note:"오래 방치된 천은 벌레와 진드기의 집이다. 털고 볕에 말렸어야 했다." }]},

{ id:"D43", kind:"함정", title:"반짝이는 것",
  body:"멀리서 무언가 강하게 반짝인다. 금속 같기도 하고 물 같기도 하다.",
  choices:[
    { t:"방향과 거리를 표시해두고, 해가 기운 뒤에 확인하러 간다", ok:true, d:{energy:1}, note:"서두르지 않은 게 물을 아꼈다." },
    { t:"반짝임이 규칙적으로 깜빡이는지 먼저 지켜본다", ok:true, d:{energy:1}, note:"규칙적이면 사람이고 아니면 자연이다." },
    { t:"사람일 수 있으니 당장 전력으로 달려간다", ok:false, d:{water:-1}, note:"한낮에 달린 대가가 컸다. 도착해보니 깨진 유리병이었다." },
    { t:"물일 것이니 가진 물을 다 마시고 출발한다", ok:false, d:{water:-1}, note:"보이는 것에 가진 것을 걸었다." },
    { t:"신기루일 테니 무시한다", ok:false, d:{energy:-1}, note:"확인하는 데 드는 비용과 놓쳤을 때의 비용이 달랐다. 표시라도 해뒀어야 했다." }]},

{ id:"D44", kind:"함정", title:"바위 틈의 그늘",
  body:"바위 사이에 깊고 시원한 틈이 있다. 한낮을 보내기 딱 좋아 보인다.",
  choices:[
    { t:"막대로 먼저 안쪽을 휘저어 확인한 뒤 들어간다", ok:true, d:{energy:1}, note:"뱀 한 마리가 나갔다." },
    { t:"틈 대신 바위 바깥쪽 그늘에 천을 쳐서 쉰다", ok:true, d:{energy:1}, note:"그늘은 얻고 위험은 피했다." },
    { t:"시원하니 바로 들어가 눕는다", ok:false, d:{energy:-1}, note:"사막에서 시원한 틈은 사람만 찾는 게 아니다. 뱀과 전갈이 먼저 와 있었다." },
    { t:"입구를 돌로 막고 안에서 잔다", ok:false, d:{energy:-1}, note:"안에 있던 것과 함께 갇혔다." },
    { t:"짐을 틈 안에 넣어 시원하게 보관한다", ok:false, d:{food:-1}, note:"꺼내려 손을 넣는 순간이 매번 도박이 됐다." }]},

{ id:"D45", kind:"몸", title:"소변의 색",
  body:"아빠가 문득 알아챈다. 소변 색이 짙은 갈색에 가깝고 양도 적다.",
  choices:[
    { t:"지금 당장 물을 마시고, 색이 옅어질 때까지 활동을 줄인다", ok:true, d:{energy:1}, note:"몸이 보내는 가장 정확한 계기판이었다." },
    { t:"소변 색을 매일 확인해 물 배분의 기준으로 삼는다", ok:true, d:{energy:1}, note:"측정 도구가 없는 곳에서 유일한 지표였다." },
    { t:"땀을 많이 흘리면 원래 그런 것이니 넘어간다", ok:false, d:{energy:-1}, note:"짙은 소변은 몸이 물을 마지막까지 아끼고 있다는 신호다. 이미 위험 구간이었다." },
    { t:"물을 한 번에 많이 마셔 단번에 해결한다", ok:false, d:{water:-1}, note:"급하게 들어간 물은 대부분 그대로 나갔다." },
    { t:"소변이 적어졌으니 물이 덜 필요한 것이라고 본다", ok:false, d:{energy:-1}, note:"정반대였다. 필요한데 없어서 아끼고 있는 것이었다." }]},

{ id:"D46", kind:"몸", title:"화상",
  body:"딸의 목덜미와 팔이 벌겋게 익었다. 만지면 아파한다.",
  choices:[
    { t:"천으로 덮어 더 타지 않게 하고, 물을 충분히 마시게 한다", ok:true, d:{energy:1}, note:"화상은 몸에서 물을 계속 빼앗는다." },
    { t:"긴 옷과 천으로 목과 팔을 감싸 앞으로도 가리게 한다", ok:true, d:{energy:1}, note:"덮는 것이 바르는 것보다 나았다." },
    { t:"시원하게 벗겨두어 열이 빠지게 한다", ok:false, d:{energy:-1}, note:"벗기자 더 탔다. 이미 익은 피부는 두 번째 햇볕에 훨씬 약하다." },
    { t:"기름을 발라 보호막을 만든다", ok:false, d:{energy:-1}, note:"기름은 열을 가둔다. 익은 자리를 더 익혔다." },
    { t:"물집이 생기면 터뜨려 물을 뺀다", ok:false, d:{energy:-1}, note:"터진 물집은 사막의 먼지가 들어가는 상처가 됐다." }]},

{ id:"D47", kind:"몸", title:"눈",
  body:"흰 모래와 바위에 반사된 빛에 눈이 시리다. 딸이 눈이 아프다고 한다.",
  choices:[

    { t:"해변 모래에서 흰 알갱이만 골라 담는다", ok:false, d:{food:-1}, note:"모래와 소금은 구별되지 않는다. 씹을 때마다 서걱거렸다." }]},

{ id:"S11", kind:"자원", title:"밀려온 코코넛",
  body:"파도에 코코넛 몇 개가 밀려와 있다. 껍질이 젖어 있다.",
  choices:[
    { t:"흔들어 안에서 물소리가 나는 것만 고른다", ok:true, d:{water:1}, note:"소리가 나면 아직 속이 살아 있다는 뜻이다." },
    { t:"껍질 섬유를 벗겨 말린 뒤 불쏘시개로 쓴다", ok:true, d:{energy:1}, note:"젖은 해변에서 가장 잘 붙는 불쏘시개였다." },
    { t:"오래 떠다닌 것일수록 잘 익었으니 그것부터 깬다", ok:false, d:{food:-1}, note:"오래 떠다닌 것은 바닷물이 스며 속이 상해 있다." },
    { t:"안의 물이 짜면 소금이 든 것이니 그대로 마신다", ok:false, d:{water:-1}, note:"짠맛이 나는 코코넛 물은 바닷물이 들어간 것이다. 상한 신호였다." },
    { t:"깨서 그늘에 두고 며칠 나눠 먹는다", ok:false, d:{food:-1}, note:"깬 코코넛은 해변의 습기와 열에서 하루를 못 간다." }]},

{ id:"S12", kind:"자원", title:"빗물",
  body:"먹구름이 몰려온다. 이 섬에서 마실 물은 비뿐이다.",
  choices:[
    { t:"넓은 잎과 천을 미리 펴 두고, 처음 얼마간은 흘려보낸다", ok:true, d:{water:1}, note:"첫 물이 씻어낸 뒤가 깨끗했다." },
    { t:"받은 물을 바로 뚜껑 있는 통에 옮겨 그늘에 둔다", ok:true, d:{water:1}, note:"받는 것만큼 보관이 중요했다." },
    { t:"비가 올 때 준비하면 되니 그때 가서 그릇을 찾는다", ok:false, d:{water:-1}, note:"스콜은 몇 분이면 지나간다. 준비하는 사이 끝났다." },
    { t:"바위의 오목한 곳에 고인 빗물을 나중에 퍼서 쓴다", ok:false, d:{water:-1}, note:"해변 바위의 오목한 곳에는 소금기가 남아 있다. 받은 물이 짜졌다." },
    { t:"많이 받으려고 그릇을 여러 개 넓게 흩어 둔다", ok:false, d:{water:-1}, note:"거두는 데 시간이 걸려 절반이 증발했다." }]},

{ id:"S13", kind:"자원", title:"잡은 것을 남기는 법",
  body:"오늘은 많이 잡았다. 하지만 냉장이 없다.",
  choices:[
    { t:"살을 얇게 저며 소금을 뿌리고 볕과 바람에 말린다", ok:true, d:{food:1}, note:"소금과 바람이 이 섬의 냉장고였다." },
    { t:"연기 위에 매달아 훈연한다", ok:true, d:{food:1}, note:"연기가 파리도 함께 막았다." },
    { t:"바닷물에 담가 두어 신선하게 유지한다", ok:false, d:{food:-1}, note:"미지근한 바닷물은 보존이 아니라 부패 조건이다." },
    { t:"모래를 파고 묻어 서늘하게 둔다", ok:false, d:{food:-1}, note:"해변 모래는 낮에 뜨겁다. 파묻은 것이 익어 있었다." },
    { t:"내장째 통으로 말린다", ok:false, d:{food:-1}, note:"내장부터 상한다. 먼저 제거했어야 했다." }]},

{ id:"S14", kind:"위기", title:"바다가 물러난다",
  body:"물이 이상하게 멀리까지 빠진다. 드러난 바닥에 물고기가 퍼덕인다. 딸이 신나서 달려가려 한다.",
  choices:[
    { t:"딸을 붙잡고 즉시 높은 곳으로 올라간다", ok:true, d:{energy:1}, note:"바다가 갑자기 물러나는 건 곧 되돌아온다는 뜻이다." },
    { t:"짐을 버리고 뒤도 안 보고 언덕 위로 뛴다", ok:true, d:{energy:1}, note:"몇 분 뒤 해변이 사라졌다." },
    { t:"물고기를 몇 마리만 빨리 주워 오기로 한다", ok:false, d:{energy:-1}, note:"그 몇 초가 전부였다. 자연이 주는 선물처럼 보이는 것이 마지막 경고였다." },
    { t:"신기한 일이니 무슨 일인지 지켜본다", ok:false, d:{energy:-1}, note:"지켜본 것이 마지막이었다." },
    { t:"바닷물이 빠졌으니 이참에 멀리까지 나가 본다", ok:false, d:{energy:-1}, note:"물이 돌아오는 속도는 사람이 달릴 수 있는 속도가 아니다." }]},

{ id:"S15", kind:"위기", title:"거처가 잠긴다",
  body:"밤에 비가 쏟아진다. 파도가 평소보다 훨씬 높이 올라온다. 거처 바닥에 물이 든다.",
  choices:[
    { t:"짐부터 높은 곳으로 옮기고 둘도 함께 올라간다", ok:true, d:{energy:1}, note:"거처는 다시 지을 수 있다." },
    { t:"딸을 먼저 높은 바위로 올려 보내고 아빠가 뒤따른다", ok:true, d:{energy:1}, note:"순서를 정하고 움직였다." },
    { t:"모래로 둑을 쌓아 물을 막는다", ok:false, d:{energy:-1}, note:"파도 앞의 모래 둑은 한 번에 무너진다. 대피할 시간을 거기 썼다." },
    { t:"거처 안에서 물이 빠지길 기다린다", ok:false, d:{energy:-1}, note:"만조와 폭우가 겹치면 물은 몇 시간 동안 계속 오른다." },
    { t:"거처를 지키려 짐을 붙잡고 버틴다", ok:false, d:{energy:-1}, note:"파도에 끌려 나갈 뻔했다. 물건보다 사람이었다." }]},

{ id:"S16", kind:"위기", title:"투명한 것",
  body:"얕은 물에서 딸이 비명을 지른다. 다리에 길고 붉은 자국이 생겼다.",
  choices:[
    { t:"바닷물로 씻어내고 붙어 있는 촉수를 카드 같은 것으로 긁어낸다", ok:true, d:{energy:1}, note:"맨손으로 만지지 않은 게 중요했다." },
    { t:"참을 수 있는 만큼 뜨거운 물에 담근다", ok:true, d:{energy:1}, note:"해파리 독은 열에 약하다." },
    { t:"민물로 깨끗이 씻어낸다", ok:false, d:{energy:-1}, note:"민물은 남아 있는 자포를 한꺼번에 터뜨린다. 씻는 순간 통증이 몇 배가 됐다." },
    { t:"모래로 문질러 촉수를 떼어낸다", ok:false, d:{energy:-1}, note:"문지르는 압력이 자포를 터뜨린다." },
    { t:"소변을 부어 중화시킨다", ok:false, d:{energy:-1}, note:"널리 퍼진 이야기지만 근거가 없고, 오히려 자포를 자극한다." }]},

{ id:"S17", kind:"위기", title:"발바닥",
  body:"바위를 건너던 아빠가 주저앉는다. 발바닥에 검은 가시가 여러 개 박혔다.",
  choices:[
    { t:"뜨거운 물에 발을 담가 통증을 줄이고, 가시가 녹아 나오길 기다린다", ok:true, d:{energy:1}, note:"성게 가시는 시간이 지나면 몸이 흡수한다." },
    { t:"바위를 건널 땐 반드시 신발을 신기로 하고, 발을 깨끗이 유지한다", ok:true, d:{energy:1}, note:"다시 밟지 않는 게 최선의 치료였다." },
    { t:"바늘로 파내 전부 뽑아낸다", ok:false, d:{energy:-1}, note:"성게 가시는 잘 부서진다. 파낼수록 조각이 깊이 들어가고 상처만 커진다." },
    { t:"맨발이 감각이 좋으니 앞으로도 맨발로 다닌다", ok:false, d:{energy:-1}, note:"열대 해안 부상의 대부분이 맨발에서 나온다." },
    { t:"돌로 눌러 짜낸다", ok:false, d:{energy:-1}, note:"눌린 자리에서 가시가 부러져 더 박혔다." }]},

{ id:"S18", kind:"위기", title:"지느러미",
  body:"바다에서 헤엄치던 중 멀지 않은 곳에 지느러미가 보인다.",
  choices:[
    { t:"물장구를 멈추고 조용히 해안 쪽으로 이동한다", ok:true, d:{energy:1}, note:"소란이 관심을 부른다." },
    { t:"등을 보이지 않고 상대를 보며 천천히 물러난다", ok:true, d:{energy:1}, note:"보고 있다는 것 자체가 신호가 된다." },
    { t:"전력으로 헤엄쳐 해안까지 간다", ok:false, d:{energy:-1}, note:"물장구는 다친 물고기의 움직임과 닮았다. 도망친 게 아니라 불렀다." },
    { t:"물속에 가만히 떠서 지나가길 기다린다", ok:false, d:{energy:-1}, note:"가만히 떠 있는 건 물 위의 실루엣이 되는 것이다." },
    { t:"잡은 물고기를 던져 주의를 돌린다", ok:false, d:{food:-1}, note:"피 냄새를 물에 풀었다. 더 가까이 왔다." }]},

{ id:"S19", kind:"위기", title:"미끄러운 바위",
  body:"물때가 낀 바위를 건너야 한다. 검은 이끼가 반들거린다.",
  choices:[
    { t:"마른 바위와 따개비가 붙은 거친 면만 골라 밟는다", ok:true, d:{energy:1}, note:"거친 곳이 안전한 곳이었다." },
    { t:"양손을 쓰며 낮은 자세로 천천히 건넌다", ok:true, d:{energy:1}, note:"세 점이 늘 바위에 닿아 있었다." },
    { t:"미끄러우니 신발을 벗고 맨발로 건넌다", ok:false, d:{energy:-1}, note:"검은 물때는 맨발에도 그대로 미끄럽고, 발바닥만 베였다." },
    { t:"빠르게 건너면 미끄러질 틈이 없으니 뛰어 건넌다", ok:false, d:{energy:-1}, note:"착지하는 순간 발이 미끄러졌다." },
    { t:"물이 얕으니 물속으로 걸어 건넌다", ok:false, d:{energy:-1}, note:"물에 잠긴 바위는 더 미끄럽고 발밑이 보이지 않는다." }]},

{ id:"S20", kind:"위기", title:"뗏목",
  body:"나무판과 그물이 꽤 모였다. 바다 건너로 나갈 수 있을 것 같다.",
  choices:[
    { t:"만들지 않기로 하고, 그 재료를 거처와 신호에 쓴다", ok:true, d:{energy:1}, note:"참는 것이 가장 어려운 판단이었다." },
    { t:"해변에서 조류 방향을 며칠 관찰한 뒤에 결정하기로 한다", ok:true, d:{energy:1}, note:"관찰해보니 흐름은 먼바다로 나가고 있었다." },
    { t:"완성되는 대로 바로 출항한다", ok:false, d:{energy:-1}, note:"조난에서 표류로 바뀌는 순간 생존 확률은 급격히 떨어진다. 육지는 최소한 물과 식량이 있는 곳이다." },
    { t:"아빠가 먼저 시험 삼아 타고 나가본다", ok:false, d:{energy:-1}, note:"흐름은 돌아오게 해주지 않는다. 시험 항해가 마지막 항해가 될 뻔했다." },
    { t:"딸을 태워 보내고 아빠는 남는다", ok:false, d:{morale:-1}, note:"아이 혼자 바다로 보내는 것이 육지에 함께 있는 것보다 안전할 리 없었다." }]},

{ id:"S21", kind:"위기", title:"한밤의 만조",
  body:"자다가 발이 축축해 깼다. 파도가 잠자리까지 올라와 있다.",
  choices:[
    { t:"당장 짐과 함께 만조선 위로 올라가 자리를 옮긴다", ok:true, d:{energy:1}, note:"밤중 이사가 귀찮았지만 살았다." },
    { t:"해변에 남은 물때 자국을 찾아 그보다 위에 다시 자리를 잡는다", ok:true, d:{energy:1}, note:"바다가 남긴 선이 가장 정확한 안내였다." },
    { t:"조금 젖는 정도니 그냥 자리를 살짝 뒤로 민다", ok:false, d:{energy:-1}, note:"만조는 아직 정점이 아니었다. 한 시간 뒤 잠자리가 잠겼다." },
    { t:"모래를 쌓아 잠자리를 높인다", ok:false, d:{energy:-1}, note:"쌓은 모래는 파도가 먼저 가져갔다." },
    { t:"젖은 채로 아침까지 버틴다", ok:false, d:{energy:-1}, note:"밤새 젖은 몸이 체온을 잃었다. 열대라도 밤바람은 차다." }]},

{ id:"S22", kind:"준비", title:"거처를 어디에 지을까",
  body:"해변에 거처를 지어야 한다. 어디에 지을지 정해야 한다.",
  choices:[
    { t:"해변에 밀려온 쓰레기와 나뭇조각이 쌓인 선보다 위쪽에 짓는다", ok:true, d:{energy:1}, note:"그 선이 바다가 표시해둔 만조선이었다." },
    { t:"모래 언덕 뒤, 바람과 파도가 한 번 꺾이는 자리에 짓는다", ok:true, d:{energy:1}, note:"언덕 하나가 방파제 역할을 했다." },
    { t:"물가에 가까울수록 편하니 파도가 닿지 않는 곳 바로 위에 짓는다", ok:false, d:{energy:-1}, note:"오늘의 파도가 이번 달의 최고 파도는 아니다. 사흘 뒤 큰 조수에 쓸려 갔다." },
    { t:"바위 절벽 바로 아래에 붙여 짓는다", ok:false, d:{energy:-1}, note:"바닷바람에 깎인 절벽은 돌을 떨군다." },
    { t:"경치가 좋은 모래 언덕 꼭대기에 짓는다", ok:false, d:{energy:-1}, note:"꼭대기는 바람을 그대로 받는다. 밤새 지붕이 날아갔다." }]},

{ id:"S23", kind:"준비", title:"바다에서 마실 물 만들기",
  body:"바닷물은 무한하고 마실 물은 없다.",
  choices:[
    { t:"불에 바닷물을 끓이고, 뚜껑에 맺힌 김을 받아 모은다", ok:true, d:{water:1}, note:"뚜껑 하나가 증류기가 됐다." },
    { t:"해변 모래를 파 바다에서 조금 떨어진 곳의 물을 받는다", ok:true, d:{water:1}, note:"모래를 지나며 걸러진 물이 훨씬 덜 짰다." },
    { t:"바닷물을 조금씩만 마셔 몸을 적응시킨다", ok:false, d:{water:-1}, note:"적응하는 몸은 없다. 배출에 드는 물이 마신 물보다 많다." },
    { t:"바닷물을 천에 여러 번 걸러 마신다", ok:false, d:{water:-1}, note:"소금은 녹아 있다. 천으로는 걸러지지 않는다." },
    { t:"바닷물을 그냥 끓여서 마신다", ok:false, d:{water:-1}, note:"끓이면 물이 날아가고 소금이 진해진다. 정반대였다." }]},

{ id:"S24", kind:"준비", title:"낚시 도구 만들기",
  body:"제대로 된 도구가 있으면 매일 먹을 수 있다.",
  choices:[
    { t:"조개껍데기와 뼈를 갈아 바늘을 만들고 그물 실로 줄을 잇는다", ok:true, d:{food:1}, note:"버리던 것이 도구가 됐다." },
    { t:"돌로 둑을 쌓아 밀물에 들어온 물고기가 썰물에 갇히게 한다", ok:true, d:{food:1}, note:"바다가 대신 잡아줬다." },
    { t:"바늘 하나에 모든 걸 걸고 큰 물고기만 노린다", ok:false, d:{food:-1}, note:"큰 것이 물자 줄이 끊기고 바늘도 잃었다. 작은 것부터가 원칙이다." },
    { t:"창을 깎아 물속의 물고기를 찔러 잡는다", ok:false, d:{energy:-1}, note:"물속의 물체는 실제보다 얕고 가깝게 보인다. 며칠을 헛찔렀다." },
    { t:"그물을 통째로 바다에 던져 놓고 기다린다", ok:false, d:{food:-1}, note:"고정하지 않은 그물은 조류가 가져갔다." }]},

{ id:"S25", kind:"준비", title:"조수 읽기",
  body:"물이 들어오고 나가는 때를 모르면 매번 위험하다.",
  choices:[
    { t:"매일 물이 가장 멀리 빠진 시각을 기록해 다음 날을 예측한다", ok:true, d:{energy:1}, note:"매일 조금씩 늦어지는 규칙이 보였다." },
    { t:"물이 가장 높이 올라온 자리에 매일 막대를 꽂아 표시한다", ok:true, d:{energy:1}, note:"막대들이 달력이 됐다." },
    { t:"조수는 매일 같은 시각이니 한 번만 재두면 된다", ok:false, d:{energy:-1}, note:"조수는 하루에 한 시간 가까이 밀린다. 사흘 뒤 계산이 완전히 어긋났다." },
    { t:"물이 빠지는 걸 보고 그때그때 판단한다", ok:false, d:{energy:-1}, note:"보고 판단하면 이미 나가 있는 중이다." },
    { t:"보름달일 때만 조심하면 된다", ok:false, d:{energy:-1}, note:"보름과 그믐 양쪽에서 조수가 커진다. 절반만 알고 있었다." }]},

{ id:"S26", kind:"준비", title:"해변의 신호",
  body:"해변은 넓고 하늘에서 잘 보인다. 이 이점을 써야 한다.",
  choices:[
    { t:"짙은 색 해초와 돌로 밝은 모래 위에 큰 글자 하나를 만든다", ok:true, d:{energy:1}, note:"대비가 큰 표시가 가장 잘 보였다." },
    { t:"불을 세 무더기로 미리 쌓아두고 언제든 붙일 수 있게 한다", ok:true, d:{energy:1}, note:"셋은 국제적으로 통하는 신호다." },
    { t:"파도가 닿는 젖은 모래에 크게 판다", ok:false, d:{energy:-1}, note:"한 번의 밀물이 다 지웠다. 만조선 위에 만들어야 했다." },
    { t:"밝은 색 천을 모래 위에 펼쳐 둔다", ok:false, d:{energy:-1}, note:"밝은 모래 위의 밝은 천은 구별되지 않는다." },
    { t:"바위에 글자를 새겨 오래 남게 한다", ok:false, d:{energy:-1}, note:"며칠이 걸렸고 상공에서는 보이지 않는 크기였다." }]},

{ id:"S27", kind:"준비", title:"불을 지키는 일",
  body:"해변은 바람이 세고 습기가 많다. 불이 자꾸 꺼진다.",
  choices:[
    { t:"모래를 파고 그 안에 불을 피워 바람을 막는다", ok:true, d:{energy:1}, note:"구덩이 하나가 바람막이가 됐다." },
    { t:"돌로 반원을 쌓아 바람 오는 쪽을 막고 그 안에서 피운다", ok:true, d:{energy:1}, note:"돌이 열을 되쏘아 화력도 올랐다." },
    { t:"바람이 잘 통해야 잘 타니 트인 곳에 피운다", ok:false, d:{energy:-1}, note:"해변의 바람은 산소를 주는 게 아니라 열을 가져간다." },
    { t:"불을 크게 키워 바람에 지지 않게 한다", ok:false, d:{energy:-1}, note:"연료만 빨리 없어졌다." },
    { t:"파도 소리가 가까운 물가 쪽에 피운다", ok:false, d:{water:-1}, note:"물보라의 소금기가 불을 죽이고 그릇을 삭혔다." }]},

{ id:"S28", kind:"준비", title:"소금기",
  body:"모든 것이 끈적하고 하얗게 굳는다. 옷도 도구도 몸도 소금투성이다.",
  choices:[
    { t:"비가 올 때마다 몸과 옷을 빗물에 헹군다", ok:true, d:{energy:1}, note:"공짜로 오는 민물을 놓치지 않았다." },
    { t:"금속 도구는 쓰고 나면 반드시 닦아 말려 둔다", ok:true, d:{energy:1}, note:"녹슬면 다시 만들 수 없는 것들이었다." },
    { t:"바닷물로 자주 씻어 깨끗하게 유지한다", ok:false, d:{energy:-1}, note:"바닷물로 씻으면 마르면서 소금이 남는다. 피부가 갈라졌다." },
    { t:"소금기는 살균이 되니 상처도 바닷물로 씻는다", ok:false, d:{energy:-1}, note:"바다에는 사람에게 위험한 세균이 있다. 상처에 바닷물은 치료가 아니다." },
    { t:"어차피 못 없애니 신경 쓰지 않는다", ok:false, d:{energy:-1}, note:"소금기에 쓸린 자리가 몇 군데씩 헐었다." }]},

{ id:"S29", kind:"준비", title:"신발",
  body:"바위와 산호에 발을 계속 다친다. 신발은 이미 망가졌다.",
  choices:[
    { t:"두꺼운 표류 나무판과 그물 끈으로 밑창을 만들어 묶는다", ok:true, d:{energy:1}, note:"모양은 흉했지만 발이 살았다." },
    { t:"타이어 조각이나 두꺼운 플라스틱을 잘라 바닥으로 쓴다", ok:true, d:{energy:1}, note:"표류물이 신발이 됐다." },
    { t:"천을 여러 겹 감아 발을 보호한다", ok:false, d:{energy:-1}, note:"젖은 천은 뾰족한 것을 막지 못하고 발만 짓무르게 했다." },
    { t:"발바닥이 단련될 때까지 맨발로 다닌다", ok:false, d:{energy:-1}, note:"단련되기 전에 베였다. 그 상처가 바닷물에 감염됐다." },
    { t:"바위 위는 기어서 이동한다", ok:false, d:{energy:-1}, note:"손까지 함께 베였다." }]},

{ id:"S30", kind:"심리", title:"수평선",
  body:"딸이 하루 종일 수평선만 보고 앉아 있다.",
  choices:[
    { t:"하루 중 정해진 시간에만 함께 수평선을 보기로 한다", ok:true, d:{morale:1}, note:"기다림에 자리를 정해줬다." },
    { t:"수평선을 보는 일을 딸의 공식 임무로 만들고 기록하게 한다", ok:true, d:{morale:1}, note:"기다림이 일이 되자 견딜 만해졌다." },
    { t:"봐도 소용없으니 그만 보라고 한다", ok:false, d:{morale:-1}, note:"희망을 금지당한 아이는 다른 것도 하지 않게 됐다." },
    { t:"곧 배가 올 거라고 함께 기다려 준다", ok:false, d:{morale:-1}, note:"오지 않은 저녁마다 조금씩 무너졌다." },
    { t:"다른 일로 바쁘게 만들어 잊게 한다", ok:false, d:{morale:-1}, note:"잊히지 않았다. 말할 곳만 없어졌다." }]},

{ id:"S31", kind:"심리", title:"딸이 물을 무서워한다",
  body:"배가 뒤집힌 뒤로 딸이 물에 들어가지 않으려 한다. 하지만 여기서 먹을 것은 대부분 바다에 있다.",
  choices:[
    { t:"발목 깊이에서 할 수 있는 일부터 맡긴다", ok:true, d:{morale:1}, note:"할 수 있는 곳에서 시작했다." },
    { t:"무섭다는 걸 인정해주고, 물에 들어가지 않는 일을 나눠 준다", ok:true, d:{morale:1}, note:"공포를 없애려 하지 않고 옆으로 비켜 갔다." },
    { t:"극복해야 하니 함께 깊은 곳까지 들어간다", ok:false, d:{morale:-1}, note:"강제로 밀어 넣은 공포는 더 단단해졌다." },
    { t:"무서우면 안 해도 된다고 아무 일도 시키지 않는다", ok:false, d:{morale:-1}, note:"피하는 것이 굳어졌다. 며칠 뒤엔 해변에도 내려오지 않았다." },
    { t:"먹을 것이 바다에 있다는 사실을 반복해서 설명한다", ok:false, d:{morale:-1}, note:"이유를 몰라서 못 들어가는 게 아니었다." }]},

{ id:"S32", kind:"심리", title:"파도 소리",
  body:"밤마다 파도 소리에 딸이 잠을 못 잔다.",
  choices:[
    { t:"잠자리를 파도 소리가 조금 멀어지는 안쪽으로 옮긴다", ok:true, d:{morale:1}, note:"몇십 미터가 큰 차이를 만들었다." },
    { t:"잠들 때까지 다른 소리로 덮어준다. 이야기를 해준다", ok:true, d:{morale:1}, note:"목소리가 파도를 덮었다." },
    { t:"익숙해질 테니 참고 자라고 한다", ok:false, d:{morale:-1}, note:"잠을 못 자는 날이 쌓이면 다른 모든 판단이 무너진다." },
    { t:"귀를 막고 자게 한다", ok:false, d:{morale:-1}, note:"소리가 아니라 그 소리가 떠올리게 하는 기억이 문제였다." },
    { t:"피곤하면 자게 되니 낮에 더 많이 움직이게 한다", ok:false, d:{energy:-1}, note:"지친 몸으로 더 못 잤다." }]},

{ id:"S33", kind:"심리", title:"놓친 배",
  body:"먼바다에 배가 지나갔다. 소리쳐도 닿지 않는 거리였다.",
  choices:[
    { t:"다음을 위한 신호를 오늘 안에 함께 만든다", ok:true, d:{morale:1}, note:"할 일이 생기자 딸이 일어났다." },
    { t:"배가 다닌다는 건 이 앞이 항로라는 뜻이라고 설명한다", ok:true, d:{morale:1}, note:"같은 사실을 다른 각도에서 보여줬다." },
    { t:"아무 일 없었던 것처럼 넘어간다", ok:false, d:{morale:-1}, note:"지나친 감정은 쌓인다." },
    { t:"다음 배는 곧 온다고 확신을 준다", ok:false, d:{morale:-1}, note:"근거 없는 약속은 지켜지지 않을 때 두 배로 무너진다." },
    { t:"왜 못 봤는지 원인을 함께 따진다", ok:false, d:{morale:-1}, note:"딸에게 남은 건 자기 탓이라는 감각뿐이었다." }]},

{ id:"S34", kind:"심리", title:"먹기 싫다",
  body:"매일 물고기와 조개뿐이다. 딸이 더는 못 먹겠다고 한다.",
  choices:[
    { t:"조리 방법을 바꿔본다. 구운 것 대신 국물로 만든다", ok:true, d:{morale:1}, note:"같은 재료가 다른 음식이 됐다." },
    { t:"해조류와 열매를 섞어 맛과 모양을 바꿔 본다", ok:true, d:{morale:1}, note:"단조로움을 깨는 것만으로 충분했다." },
    { t:"살려면 먹어야 한다고 강하게 먹인다", ok:false, d:{morale:-1}, note:"먹는 일이 벌이 되자 더 안 먹었다." },
    { t:"먹기 싫으면 굶으라고 둔다", ok:false, d:{energy:-1}, note:"한 끼가 이틀이 됐다." },
    { t:"집에 가면 먹고 싶은 걸 다 사주겠다고 한다", ok:false, d:{morale:-1}, note:"지금 있는 것이 더 초라해졌다." }]},

{ id:"S35", kind:"심리", title:"딸이 아빠를 걱정한다",
  body:"아빠가 며칠째 잘 못 먹고 있다. 딸이 자기 몫을 자꾸 밀어준다.",
  choices:[
    { t:"고맙다고 받되, 절반만 받고 나머지는 딸이 먹게 한다", ok:true, d:{morale:1}, note:"마음을 거절하지 않으면서 몫도 지켰다." },
    { t:"둘이 나눠 먹는 규칙을 함께 정해 눈에 보이게 만든다", ok:true, d:{morale:1}, note:"규칙이 있으면 매번 실랑이하지 않아도 된다." },
    { t:"아빠는 괜찮다며 전부 딸에게 준다", ok:false, d:{energy:-1}, note:"아빠가 쓰러지면 딸도 끝이다. 딸도 그걸 알고 있었다." },
    { t:"어른 걱정은 하지 말라고 잘라 말한다", ok:false, d:{morale:-1}, note:"돌보고 싶은 마음을 밀어냈다. 딸은 그 뒤로 아무것도 나누지 않았다." },
    { t:"딸이 주는 대로 다 받아먹는다", ok:false, d:{morale:-1}, note:"딸이 굶었다. 어른이 정했어야 할 선이었다." }]},

{ id:"S36", kind:"심리", title:"바다에 대고 소리치기",
  body:"딸이 갑자기 바다를 향해 소리를 지른다. 화가 난 것 같기도, 슬픈 것 같기도 하다.",
  choices:[
    { t:"말리지 않고 옆에서 함께 소리를 지른다", ok:true, d:{morale:1}, note:"목이 쉬도록 소리치고 나서 둘 다 웃었다." },
    { t:"다 지르고 나면 옆에 앉아 아무 말 없이 있어 준다", ok:true, d:{morale:1}, note:"설명 없이 옆에 있는 것으로 충분했다." },
    { t:"체력 낭비니 그만하라고 한다", ok:false, d:{morale:-1}, note:"감정을 낭비로 취급하면 다음부터 아무 표현도 하지 않는다." },
    { t:"왜 그러는지 이유를 캐묻는다", ok:false, d:{morale:-1}, note:"본인도 모르는 것이었다. 대답을 요구받자 입을 닫았다." },
    { t:"위험하니 해변에서 떨어뜨려 놓는다", ok:false, d:{morale:-1}, note:"감정을 표현할 자리까지 빼앗았다." }]},

{ id:"S37", kind:"심리", title:"딸의 발견",
  body:"딸이 혼자 조수 웅덩이에서 게 잡는 법을 알아냈다며 자랑한다.",
  choices:[
    { t:"방법을 자세히 물어보고 그걸 둘의 정식 방법으로 삼는다", ok:true, d:{morale:1}, note:"아이의 방법이 채택되자 표정이 달라졌다." },
    { t:"앞으로 게 잡는 일은 딸이 맡기로 정한다", ok:true, d:{morale:1}, note:"전문 분야가 생겼다." },
    { t:"잘했다고 칭찬만 하고 아빠 방식대로 계속한다", ok:false, d:{morale:-1}, note:"말로만 하는 인정은 아이가 가장 빨리 알아챈다." },
    { t:"위험할 수 있으니 앞으로 혼자 하지 말라고 한다", ok:false, d:{morale:-1}, note:"성취를 말한 결과가 금지였다. 다음부터 말하지 않았다." },
    { t:"더 좋은 방법을 알려주며 고쳐준다", ok:false, d:{morale:-1}, note:"자기 것이 아니게 됐다." }]},

{ id:"S38", kind:"함정", title:"부풀어 오른 물고기",
  body:"잡힌 물고기 하나가 배를 부풀리며 몸을 둥글게 만든다. 살이 많아 보인다.",
  choices:[
    { t:"손대지 않고 바다로 돌려보낸다", ok:true, d:{energy:1}, note:"먹지 않기로 한 판단이 살렸다." },
    { t:"다른 평범한 물고기만 골라 손질한다", ok:true, d:{food:1}, note:"고를 줄 아는 게 기술이었다." },
    { t:"내장만 버리고 살은 먹는다", ok:false, d:{food:-1}, note:"복어의 독은 내장뿐 아니라 껍질과 살에도 퍼져 있는 종이 많다. 부위로 가릴 수 있는 게 아니다." },
    { t:"오래 끓여 독을 날린 뒤 먹는다", ok:false, d:{food:-1}, note:"이 독은 끓여도 분해되지 않는다." },
    { t:"조금만 먹어보고 괜찮으면 더 먹는다", ok:false, d:{energy:-1}, note:"조금으로도 충분히 위험한 독이었다. 맛보기가 통하지 않는 유일한 부류다." }]},

{ id:"S39", kind:"함정", title:"아름다운 껍데기",
  body:"모래 위에 무늬가 정교한 원뿔형 조개껍데기가 있다. 딸이 주우려 한다.",
  choices:[
    { t:"안에 살아 있는 것이 있을 수 있으니 막대로 뒤집어 확인한다", ok:true, d:{energy:1}, note:"안에서 무언가 움직였다." },
    { t:"주울 때는 빈 껍데기인지 확인하고 넓은 쪽을 잡는다", ok:true, d:{energy:1}, note:"잡는 위치까지 정한 게 좋았다." },
    { t:"예쁘니 그냥 손으로 집어 딸에게 준다", ok:false, d:{energy:-1}, note:"원뿔형 껍데기 중에는 사람을 죽일 수 있는 독침을 쏘는 종이 있다. 살아 있는 것을 맨손으로 집었다." },
    { t:"딸이 갖고 싶어 하니 주머니에 넣어준다", ok:false, d:{energy:-1}, note:"주머니 안에서 쏘였다." },
    { t:"물로 씻어서 준다", ok:false, d:{energy:-1}, note:"씻는 동안 손바닥에 침이 박혔다." }]},
